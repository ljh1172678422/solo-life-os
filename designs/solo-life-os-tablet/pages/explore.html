    <style id="critical-layout">
      /* Tablet app shell: fixed sidebar + natural scrolling content */
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--solo-background);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      .app-sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 72px;
        background: var(--solo-card);
        border-right: 1px solid var(--solo-border);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 0;
        z-index: 50;
      }
      .app-main {
        margin-left: 72px;
        padding: 24px;
        min-height: 100vh;
      }
      @media (min-width: 768px) {
        .app-main { padding: 32px; }
      }
      /* Hero gradient card - warm sunset/coffee lighting atmosphere */
      .hero-gradient {
        background: linear-gradient(135deg, var(--solo-primary) 0%, var(--solo-primary-600) 30%, var(--solo-primary-800) 70%, var(--solo-primary-900) 100%);
        position: relative;
        overflow: hidden;
      }
      .hero-gradient::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 80% 20%, rgba(253,186,116,0.35) 0%, transparent 60%),
                    radial-gradient(ellipse at 20% 80%, rgba(124,45,18,0.25) 0%, transparent 50%);
        pointer-events: none;
      }
      .hero-gradient > * { position: relative; z-index: 1; }
      /* Filter pills container */
      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .filter-pill {
        display: inline-flex;
        align-items: center;
        height: 36px;
        padding: 0 16px;
        border-radius: var(--solo-radius-full);
        background: var(--solo-card);
        border: 1px solid var(--solo-border);
        color: var(--solo-muted-foreground);
        font-size: 14px;
        white-space: nowrap;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }
      .filter-pill:hover {
        background: var(--solo-muted);
      }
      .filter-pill.active {
        background: var(--solo-primary);
        color: #fff;
        border-color: var(--solo-primary);
      }
      /* Place card grid */
      .place-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      @media (min-width: 1024px) {
        .place-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }
      .place-card {
        background: var(--solo-card);
        border: 1px solid var(--solo-border);
        border-radius: var(--solo-radius-lg);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      .place-card:hover {
        border-color: var(--solo-primary-300);
        transform: translateY(-1px);
      }
      .place-card .icon-block {
        width: 40px;
        height: 40px;
        border-radius: var(--solo-radius-md);
        background: var(--solo-primary-100);
        color: var(--solo-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      /* Sidebar nav item */
      .nav-item {
        width: 44px;
        height: 44px;
        border-radius: var(--solo-radius-md);
        color: var(--solo-muted-foreground);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.15s ease, color 0.15s ease;
        text-decoration: none;
      }
      .nav-item:hover { background: var(--solo-muted); }
      .nav-item.active {
        background: var(--solo-primary-100);
        color: var(--solo-primary);
      }
      .sidebar-logo {
        width: 40px;
        height: 40px;
        border-radius: var(--solo-radius-md);
        background: var(--solo-primary);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 32px;
      }
      /* Star rating */
      .star { color: #FBBF24; }
      /* No scrollbar for filter scroll on small screens */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

</head>
