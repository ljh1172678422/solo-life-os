/* Solo - AI Life OS Brand CSS */
/* Warm sunrise orange - representing sunlight, warmth, and new beginnings */

:root {
  /* Primary: Warm Sunrise Orange */
  --solo-primary-50: #FFF7ED;
  --solo-primary-100: #FFEDD5;
  --solo-primary-200: #FED7AA;
  --solo-primary-300: #FDBA74;
  --solo-primary-400: #FB923C;
  --solo-primary-500: #F97316;
  --solo-primary-600: #EA580C;
  --solo-primary-700: #C2410C;
  --solo-primary-800: #9A3412;
  --solo-primary-900: #7C2D12;

  /* Neutral: Warm Stone */
  --solo-neutral-50: #FAFAF9;
  --solo-neutral-100: #F5F5F4;
  --solo-neutral-200: #E7E5E4;
  --solo-neutral-300: #D6D3D1;
  --solo-neutral-400: #A8A29E;
  --solo-neutral-500: #78716C;
  --solo-neutral-600: #57534E;
  --solo-neutral-700: #44403C;
  --solo-neutral-800: #292524;
  --solo-neutral-900: #1C1917;

  /* Semantic Status Colors */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* Semantic Aliases */
  --solo-background: var(--solo-neutral-50);
  --solo-foreground: var(--solo-neutral-900);
  --solo-card: #FFFFFF;
  --solo-card-foreground: var(--solo-neutral-800);
  --solo-popover: #FFFFFF;
  --solo-popover-foreground: var(--solo-neutral-800);
  --solo-primary: var(--solo-primary-500);
  --solo-primary-foreground: #FFFFFF;
  --solo-muted: var(--solo-neutral-100);
  --solo-muted-foreground: var(--solo-neutral-500);
  --solo-border: var(--solo-neutral-200);
  --solo-input: var(--solo-neutral-200);
  --solo-ring: var(--solo-primary-400);

  /* Radius */
  --solo-radius-sm: 8px;
  --solo-radius-md: 12px;
  --solo-radius-lg: 16px;
  --solo-radius-full: 9999px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      /* Progress ring using conic-gradient */
      .progress-ring {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 9999px;
        background: conic-gradient(var(--solo-primary) 0deg 252deg, var(--solo-primary-100) 252deg 360deg);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .progress-ring::after {
        content: "";
        position: absolute;
        width: 76px;
        height: 76px;
        border-radius: 9999px;
        background: #FFFFFF;
      }
      .progress-ring-inner {
        position: relative;
        z-index: 1;
        font-size: 24px;
        font-weight: 700;
        color: var(--solo-primary);
        line-height: 1;
      }
      /* Heatmap dot */
      .heat-dot {
        width: 28px;
        height: 28px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .heat-dot-done {
        background-color: var(--solo-primary);
      }
      .heat-dot-today {
        border: 2px solid var(--solo-primary);
        background-color: transparent;
      }
      .heat-dot-future {
        border: 1.5px solid var(--solo-neutral-200);
        background-color: transparent;
      }
      /* Book cover placeholder */
      .book-cover {
        width: 48px;
        height: 64px;
        border-radius: 6px;
        background: linear-gradient(135deg, var(--solo-primary-200), var(--solo-primary-300));
        flex-shrink: 0;
        position: relative;
        overflow: hidden;
      }
      .book-cover::after {
        content: "";
        position: absolute;
        left: 6px;
        top: 10px;
        right: 6px;
        height: 3px;
        background: rgba(255,255,255,0.6);
        border-radius: 2px;
      }
      .book-cover::before {
        content: "";
        position: absolute;
        left: 6px;
        top: 18px;
        right: 10px;
        height: 2px;
        background: rgba(255,255,255,0.4);
        border-radius: 2px;
        box-shadow: 0 6px 0 rgba(255,255,255,0.4), 0 12px 0 rgba(255,255,255,0.3);
      }
      /* Milestone badge */
      .milestone-badge {
        width: 48px;
        height: 48px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        flex-shrink: 0;
      }
      .milestone-earned {
        background-color: var(--solo-primary-100);
      }
      .milestone-locked {
        background-color: var(--solo-neutral-100);
        opacity: 0.6;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased bg-neutral-50">

  <!-- 顶部导航 -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-border">
    <div class="w-full max-w-md mx-auto flex items-center justify-between px-4 h-[52px] relative">
      <button data-dom-id="btn-back" class="w-9 h-9 rounded-full bg-muted flex items-center justify-center border-0 cursor-pointer flex-shrink-0" aria-label="返回">
        <i data-lucide="chevron-left" style="width:18px;height:18px;color:var(--solo-neutral-700)"></i>
      </button>
      <div class="absolute left-1/2 -translate-x-1/2 flex items-center gap-1.5">
        <i data-lucide="book-open" style="width:16px;height:16px;color:var(--solo-primary)"></i>
        <h1 class="text-[17px] font-semibold text-foreground m-0">阅读</h1>
      </div>
      <button class="w-9 h-9 rounded-full bg-muted flex items-center justify-center border-0 cursor-pointer flex-shrink-0" aria-label="更多">
        <i data-lucide="more-vertical" style="width:18px;height:18px;color:var(--solo-neutral-700)"></i>
      </button>
    </div>
  </header>

  <main class="w-full max-w-md mx-auto px-4 pt-2 pb-24">

    <!-- 2. 目标头部大卡片 -->
    <section class="rounded-xl p-5 text-center mb-4" style="background:linear-gradient(135deg,var(--solo-primary-100),var(--solo-primary-50));">
      <div class="flex justify-center mb-3">
        <div class="progress-ring">
          <span class="progress-ring-inner">70%</span>
        </div>
      </div>
      <p class="text-sm text-neutral-600 m-0 mb-1.5">本月目标：读完2本书</p>
      <p class="text-sm font-medium m-0" style="color:var(--solo-primary-700)">
        当前连续 <span class="font-bold">18</span> 天 <span class="ml-0.5">🔥</span>
      </p>
    </section>

    <!-- 3. 今日打卡 -->
    <section class="bg-white border border-border rounded-2xl p-4 mb-4">
      <h2 class="text-base font-semibold text-foreground m-0 mb-3">今日阅读打卡</h2>
      <button data-dom-id="btn-checkin" class="w-full py-4 rounded-xl text-lg font-medium text-white border-0 cursor-pointer flex items-center justify-center gap-2" style="background-color:var(--solo-primary);">
        <span>📖</span>
        <span>标记今日已阅读</span>
      </button>
      <p class="text-xs text-center m-0 mt-2 text-muted-foreground">读了几页也是进步</p>
    </section>

    <!-- 4. 本周热力图 -->
    <section class="bg-white border border-border rounded-2xl p-4 mb-4">
      <h2 class="text-base font-semibold text-foreground m-0 mb-4">本周</h2>
      <div class="flex justify-between items-start px-1">
        <!-- 周一 (done) -->
        <div class="flex flex-col items-center gap-1.5">
          <div class="heat-dot heat-dot-done"></div>
          <span class="text-xs text-muted-foreground">一</span>
        </div>
        <!-- 周二 (done) -->
        <div class="flex flex-col items-center gap-1.5">
          <div class="heat-dot heat-dot-done"></div>
          <span class="text-xs text-muted-foreground">二</span>
        </div>
        <!-- 周三 (done) -->
        <div class="flex flex-col items-center gap-1.5">
          <div class="heat-dot heat-dot-done"></div>
          <span class="text-xs text-muted-foreground">三</span>
        </div>
        <!-- 周四 (done) -->
        <div class="flex flex-col items-center gap-1.5">
          <div class="heat-dot heat-dot-done"></div>
          <span class="text-xs text-muted-foreground">四</span>
        </div>
        <!-- 周五 (done) -->
        <div class="flex flex-col items-center gap-1.5">
          <div class="heat-dot heat-dot-done"></div>
          <span class="text-xs text-muted-foreground">五</span>
        </div>
        <!-- 周六 (today) -->
        <div class="flex flex-col items-center gap-1.5">
          <div class="heat-dot heat-dot-today"></div>
          <span class="text-xs font-medium" style="color:var(--solo-primary)">六</span>
        </div>
        <!-- 周日 (future) -->
        <div class="flex flex-col items-center gap-1.5">
          <div class="heat-dot heat-dot-future"></div>
          <span class="text-xs text-muted-foreground">日</span>
        </div>
      </div>
    </section>

    <!-- 5. 当前在读 -->
    <section class="mb-4">
      <h2 class="text-base font-semibold text-foreground m-0 mb-3">在读的书</h2>
      <div class="bg-white border border-border rounded-lg p-3 flex items-center gap-3">
        <div class="book-cover"></div>
        <div class="flex-1 min-w-0">
          <p class="font-medium text-foreground m-0 mb-1 truncate">《活着》</p>
          <p class="text-sm text-muted-foreground m-0 mb-2">已读 70% · 第8章</p>
          <div class="w-full h-1 rounded-full bg-muted overflow-hidden">
            <div class="h-full rounded-full" style="width:70%;background-color:var(--solo-primary);"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 6. 最近记录 -->
    <section class="mb-4">
      <h2 class="text-base font-semibold text-foreground m-0 mb-3">最近记录</h2>
      <div class="bg-white border border-border rounded-lg p-4">
        <div class="flex justify-between items-center py-2 text-sm border-b border-border">
          <span class="text-foreground">今天</span>
          <span class="text-muted-foreground">30分钟 · 第8章</span>
        </div>
        <div class="flex justify-between items-center py-2 text-sm border-b border-border">
          <span class="text-foreground">昨天</span>
          <span class="text-muted-foreground">45分钟 · 第7章</span>
        </div>
        <div class="flex justify-between items-center py-2 text-sm">
          <span class="text-foreground">前天</span>
          <span class="text-muted-foreground">20分钟 · 第7章</span>
        </div>
      </div>
    </section>

    <!-- 7. 里程碑 -->
    <section class="mb-4">
      <h2 class="text-base font-semibold text-foreground m-0 mb-3">里程碑</h2>
      <div class="bg-white border border-border rounded-lg p-4">
        <div class="flex justify-around items-start">
          <div class="flex flex-col items-center gap-1.5">
            <div class="milestone-badge milestone-earned">🔥</div>
            <span class="text-xs font-medium" style="color:var(--solo-primary)">7天连续</span>
          </div>
          <div class="flex flex-col items-center gap-1.5">
            <div class="milestone-badge milestone-locked">🏆</div>
            <span class="text-xs text-muted-foreground">100天</span>
          </div>
          <div class="flex flex-col items-center gap-1.5">
            <div class="milestone-badge milestone-locked">📚</div>
            <span class="text-xs text-muted-foreground">读完10本</span>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- 8. 底部操作栏 (fixed bottom) -->
  <div class="fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur border-t border-border p-3">
    <div class="w-full max-w-md mx-auto flex justify-between items-center">
      <button class="text-sm text-muted-foreground bg-transparent border-0 cursor-pointer py-1 px-1">添加笔记</button>
      <button data-dom-id="btn-share" class="inline-flex items-center gap-1.5 text-white rounded-full px-6 py-2.5 text-sm font-medium border-0 cursor-pointer" style="background-color:var(--solo-primary);">
        <i data-lucide="share-2" style="width:14px;height:14px"></i>
        <span>分享成就</span>
      </button>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
