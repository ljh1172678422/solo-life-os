/* Solo - AI Life OS Brand CSS */
/* Warm sunrise orange - representing sunlight, warmth, and new beginnings */

:root {
  /* Primary: Warm Sunrise Orange */
  --solo-primary-50: #FFF7ED;
  --solo-primary-100: #FFEDD5;
  --solo-primary-200: #FED7AA;
  --solo-primary-300: #FDBA74;
  --solo-primary-400: #FB923C;
  --solo-primary-500: #F97316;
  --solo-primary-600: #EA580C;
  --solo-primary-700: #C2410C;
  --solo-primary-800: #9A3412;
  --solo-primary-900: #7C2D12;

  /* Neutral: Warm Stone */
  --solo-neutral-50: #FAFAF9;
  --solo-neutral-100: #F5F5F4;
  --solo-neutral-200: #E7E5E4;
  --solo-neutral-300: #D6D3D1;
  --solo-neutral-400: #A8A29E;
  --solo-neutral-500: #78716C;
  --solo-neutral-600: #57534E;
  --solo-neutral-700: #44403C;
  --solo-neutral-800: #292524;
  --solo-neutral-900: #1C1917;

  /* Semantic Status Colors */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* Semantic Aliases */
  --solo-background: var(--solo-neutral-50);
  --solo-foreground: var(--solo-neutral-900);
  --solo-card: #FFFFFF;
  --solo-card-foreground: var(--solo-neutral-800);
  --solo-popover: #FFFFFF;
  --solo-popover-foreground: var(--solo-neutral-800);
  --solo-primary: var(--solo-primary-500);
  --solo-primary-foreground: #FFFFFF;
  --solo-muted: var(--solo-neutral-100);
  --solo-muted-foreground: var(--solo-neutral-500);
  --solo-border: var(--solo-neutral-200);
  --solo-input: var(--solo-neutral-200);
  --solo-ring: var(--solo-primary-400);

  /* Radius */
  --solo-radius-sm: 8px;
  --solo-radius-md: 12px;
  --solo-radius-lg: 16px;
  --solo-radius-full: 9999px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

<body class="min-h-screen font-sans antialiased bg-neutral-50">
    <main class="w-full max-w-md mx-auto px-4 pt-2 pb-8">
        <!-- 顶部导航 -->
        <nav class="flex items-center justify-between h-12 -mx-4 px-4 sticky top-0 z-10" style="background: rgba(250,250,249,0.92); backdrop-filter: blur(8px);">
            <button data-dom-id="btn-back" class="w-9 h-9 flex items-center justify-center -ml-2 rounded-full active:bg-neutral-100">
                <i data-lucide="chevron-left" class="w-6 h-6 text-neutral-700"></i>
            </button>
            <h1 class="text-base font-semibold text-neutral-900">成长统计</h1>
            <button class="w-9 h-9 flex items-center justify-center -mr-2 rounded-full active:bg-neutral-100">
                <i data-lucide="share-2" class="w-[20px] h-[20px] text-neutral-700"></i>
            </button>
        </nav>

        <!-- 时间范围切换 -->
        <div class="flex gap-2 mt-3 mb-4">
            <button class="px-4 py-1.5 rounded-full text-sm font-medium bg-muted text-muted-foreground transition-colors">周</button>
            <button class="px-4 py-1.5 rounded-full text-sm font-medium bg-primary text-white shadow-sm transition-colors">月</button>
            <button class="px-4 py-1.5 rounded-full text-sm font-medium bg-muted text-muted-foreground transition-colors">年</button>
            <button class="px-4 py-1.5 rounded-full text-sm font-medium bg-muted text-muted-foreground transition-colors">全部</button>
        </div>

        <!-- 本月总览卡片 -->
        <div class="rounded-xl p-5 text-center mb-4" style="background: linear-gradient(135deg, var(--solo-primary-100) 0%, #FFFBEB 100%);">
            <div class="text-[44px] leading-none font-bold mb-2" style="color: var(--solo-primary-700);">82<span class="text-2xl font-semibold">%</span></div>
            <div class="text-sm mb-4" style="color: var(--solo-primary-600); opacity: 0.85;">本月目标完成率</div>
            <div class="flex items-center justify-center gap-3 text-xs" style="color: var(--solo-primary-600); opacity: 0.75;">
                <span>完成23项</span>
                <span class="w-1 h-1 rounded-full" style="background: var(--solo-primary-400);"></span>
                <span>坚持18天</span>
                <span class="w-1 h-1 rounded-full" style="background: var(--solo-primary-400);"></span>
                <span>新增1个目标</span>
            </div>
        </div>

        <!-- 完成率趋势柱状图 -->
        <div class="bg-white border border-border rounded-lg p-4 mb-4">
            <h3 class="text-sm font-semibold text-neutral-800 mb-5">完成率趋势</h3>
            <div class="flex items-end justify-between gap-2 h-36 px-1">
                <!-- 周一 -->
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full rounded-t-md bg-primary-200" style="height: 45%;"></div>
                    <span class="text-[11px] text-neutral-400">一</span>
                </div>
                <!-- 周二 -->
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full rounded-t-md bg-primary-200" style="height: 60%;"></div>
                    <span class="text-[11px] text-neutral-400">二</span>
                </div>
                <!-- 周三 -->
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full rounded-t-md bg-primary-200" style="height: 52%;"></div>
                    <span class="text-[11px] text-neutral-400">三</span>
                </div>
                <!-- 周四 -->
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full rounded-t-md bg-primary-200" style="height: 72%;"></div>
                    <span class="text-[11px] text-neutral-400">四</span>
                </div>
                <!-- 周五 (最高) -->
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full rounded-t-md bg-primary shadow-sm" style="height: 90%;"></div>
                    <span class="text-[11px] text-primary font-medium">五</span>
                </div>
                <!-- 周六 -->
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full rounded-t-md bg-primary-200" style="height: 68%;"></div>
                    <span class="text-[11px] text-neutral-400">六</span>
                </div>
                <!-- 周日 -->
                <div class="flex-1 flex flex-col items-center gap-2">
                    <div class="w-full rounded-t-md bg-primary-200" style="height: 80%;"></div>
                    <span class="text-[11px] text-neutral-400">日</span>
                </div>
            </div>
        </div>

        <!-- 目标投入分布 -->
        <div class="bg-white border border-border rounded-lg p-4 mb-4">
            <h3 class="text-sm font-semibold text-neutral-800 mb-4">时间都花在哪了</h3>
            <!-- 彩色横条 -->
            <div class="flex h-9 rounded-lg overflow-hidden mb-4">
                <div class="flex items-center justify-center" style="width: 35%; background: var(--solo-primary-500);">
                    <span class="text-[11px] text-white font-medium">35%</span>
                </div>
                <div class="flex items-center justify-center" style="width: 28%; background: #22C55E;">
                    <span class="text-[11px] text-white font-medium">28%</span>
                </div>
                <div class="flex items-center justify-center" style="width: 22%; background: #3B82F6;">
                    <span class="text-[11px] text-white font-medium">22%</span>
                </div>
                <div class="flex items-center justify-center" style="width: 15%; background: #F59E0B;">
                    <span class="text-[11px] text-white font-medium">15%</span>
                </div>
            </div>
            <!-- 图例 -->
            <div class="grid grid-cols-2 gap-y-2.5 gap-x-4">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-sm shrink-0" style="background: var(--solo-primary-500);"></span>
                    <span class="text-xs text-neutral-600">阅读</span>
                    <span class="text-xs text-neutral-400 ml-auto">35%</span>
                </div>
