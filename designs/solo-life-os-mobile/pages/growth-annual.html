    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      /* Wrapped-style subtle float animation */
      @keyframes float-gentle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .float-gentle { animation: float-gentle 4s ease-in-out infinite; }

      @keyframes fade-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-up { animation: fade-up 0.7s ease-out both; }
      .delay-1 { animation-delay: 0.1s; }
      .delay-2 { animation-delay: 0.25s; }
      .delay-3 { animation-delay: 0.4s; }
      .delay-4 { animation-delay: 0.55s; }
      .delay-5 { animation-delay: 0.7s; }
      .delay-6 { animation-delay: 0.85s; }
      .delay-7 { animation-delay: 1.0s; }
      .delay-8 { animation-delay: 1.15s; }

      /* Route dashed line decoration */
      .route-path {
        stroke-dasharray: 4 6;
        stroke-linecap: round;
        animation: dash-flow 3s linear infinite;
      }
      @keyframes dash-flow {
        to { stroke-dashoffset: -40; }
      }

      /* Soft glow behind cover number */
      .cover-glow {
        position: absolute;
        inset: -40px;
        background: radial-gradient(circle, rgba(249,115,22,0.18) 0%, rgba(249,115,22,0) 65%);
        filter: blur(20px);
        z-index: 0;
      }

      /* Book spines */
      .book-spine {
        width: 2rem;
        height: 3rem;
        border-radius: 4px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08), inset 1px 0 0 rgba(255,255,255,0.25);
        position: relative;
      }
      .book-spine::after {
        content: '';
        position: absolute;
        left: 3px; top: 4px; bottom: 4px;
        width: 2px;
        background: rgba(255,255,255,0.35);
        border-radius: 1px;
      }

          <p class="text-sm text-neutral-600 text-center">新的爱好，让生活更丰富</p>
        </div>
      </section>

      <!-- 5. 你走了多远 -->
      <section class="fade-up delay-3 mb-4">
        <div class="bg-white border border-neutral-200 rounded-xl p-6 text-center shadow-sm">
          <p class="text-sm text-neutral-500 mb-4">你一共走了</p>
          <div class="text-5xl font-bold text-neutral-900 leading-none mb-2" style="background: linear-gradient(135deg, var(--solo-primary-500), #EA580C); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
            462<span class="text-2xl font-semibold ml-1">km</span>
          </div>
          <p class="text-sm text-neutral-500 mb-5">相当于从杭州走到南京</p>
          <!-- Running route SVG decoration -->
          <div class="relative h-16 w-full overflow-hidden rounded-lg" style="background: linear-gradient(180deg, var(--solo-primary-50) 0%, #FFFFFF 100%);">
            <svg viewBox="0 0 320 64" class="w-full h-full" preserveAspectRatio="none">
              <path d="M0,40 C40,40 60,20 100,28 C140,36 160,52 200,40 C240,28 260,18 300,24 L320,24"
                    fill="none" stroke="var(--solo-primary-300)" stroke-width="2.5" class="route-path"/>
              <!-- start marker -->
              <circle cx="0" cy="40" r="4" fill="var(--solo-primary-500)"/>
              <!-- end marker (flag) -->
              <circle cx="300" cy="24" r="5" fill="var(--solo-primary-500)"/>
              <circle cx="300" cy="24" r="9" fill="var(--solo-primary-500)" opacity="0.2"/>
            </svg>
            <div class="absolute left-2 bottom-1 flex items-center gap-1">
              <i data-lucide="map-pin" class="w-3 h-3" style="color:var(--solo-primary-500)"></i>
              <span class="text-[10px] text-neutral-500">杭州</span>
            </div>
            <div class="absolute right-2 bottom-1 flex items-center gap-1">
              <span class="text-[10px] text-neutral-500">南京</span>
              <i data-lucide="flag" class="w-3 h-3" style="color:var(--solo-primary-500)"></i>
            </div>
          </div>
        </div>
      </section>

      <!-- 6. 读了多少书 -->
      <section class="fade-up delay-4 mb-4">
        <div class="rounded-xl p-6 shadow-sm" style="background: linear-gradient(135deg, #FFFBEB 0%, var(--solo-primary-50) 100%);">
          <div class="text-center mb-5">
            <p class="text-sm text-neutral-500 mb-3">你读完了</p>
            <div class="text-5xl font-bold text-primary leading-none mb-2">12<span class="text-2xl font-semibold ml-1">本</span></div>
            <p class="text-sm text-neutral-500">比去年多了 5 本</p>
          </div>
          <!-- Book spines -->
          <div class="flex items-end justify-center gap-1.5 h-14">
            <div class="book-spine" style="background: linear-gradient(180deg, #60A5FA, #3B82F6); height: 2.5rem;"></div>
            <div class="book-spine" style="background: linear-gradient(180deg, #F87171, #EF4444); height: 3rem;"></div>
            <div class="book-spine" style="background: linear-gradient(180deg, #FBBF24, #F59E0B); height: 2.75rem;"></div>
            <div class="book-spine" style="background: linear-gradient(180deg, #34D399, #10B981); height: 3rem;"></div>
            <div class="book-spine" style="background: linear-gradient(180deg, #A78BFA, #8B5CF6); height: 2.5rem;"></div>
            <div class="book-spine" style="background: linear-gradient(180deg, #FB923C, #F97316); height: 2.9rem;"></div>
            <div class="book-spine" style="background: linear-gradient(180deg, #F472B6, #EC4899); height: 2.6rem;"></div>
            <div class="book-spine" style="background: linear-gradient(180deg, #22D3EE, #06B6D4); height: 3rem;"></div>
          </div>
          <p class="text-xs text-center text-neutral-500 mt-3">每一本，都是一次新的旅程</p>
        </div>
      </section>

      <!-- 7. AI年度总结 -->
      <section class="fade-up delay-5 mb-4">
        <div class="rounded-xl p-6 text-center leading-relaxed shadow-sm" style="background: linear-gradient(135deg, var(--solo-primary-100) 0%, #FEF3C7 100%);">
          <div class="w-14 h-14 rounded-full bg-white/70 flex items-center justify-center mx-auto mb-4 shadow-sm">
            <i data-lucide="sparkles" class="w-7 h-7" style="color:var(--solo-primary-600)"></i>
          </div>
          <p class="text-sm text-neutral-700 leading-relaxed">
            这一年，你尝试了新的爱好，坚持了阅读，走了很多路。你比去年更<span class="font-semibold" style="color:var(--solo-primary-700)">勇敢</span>，也更懂得享受<span class="font-semibold" style="color:var(--solo-primary-700)">一个人的时光</span>。
          </p>
          <p class="text-sm text-neutral-700 leading-relaxed mt-3">
            新的一年，继续探索，继续<span class="font-semibold" style="color:var(--solo-primary-700)">成长</span>。
          </p>
          <div class="flex items-center justify-center gap-1 mt-5">
            <div class="w-1.5 h-1.5 rounded-full" style="background-color:var(--solo-primary-300)"></div>
            <div class="w-1.5 h-1.5 rounded-full" style="background-color:var(--solo-primary-400)"></div>
            <div class="w-1.5 h-1.5 rounded-full" style="background-color:var(--solo-primary-500)"></div>
          </div>
        </div>
      </section>

      <!-- Spacer for breathing room -->
      <div class="h-4"></div>

      <!-- 8. 分享按钮 -->
      <section class="fade-up delay-6">
        <button data-dom-id="btn-share" class="w-full py-4 rounded-full bg-primary text-white font-medium flex items-center justify-center gap-2 shadow-lg shadow-orange-500/25 active:scale-[0.98] transition-transform" style="background-color:var(--solo-primary);">
          <i data-lucide="share-2" class="w-5 h-5"></i>
          <span>分享我的2026</span>
        </button>
        <button data-dom-id="btn-save-story" class="w-full mt-3 text-sm text-center text-primary py-2 active:opacity-70 transition-opacity">
          保存到Life Story
        </button>

        <!-- Bottom brand mark -->
        <div class="mt-8 flex items-center justify-center gap-2 text-xs text-neutral-400">
          <i data-lucide="sprout" class="w-3.5 h-3.5"></i>
          <span>Solo · 你的生活操作系统</span>
        </div>
      </section>

    </main>

    <script>lucide.createIcons();</script>
</body>
