/* Solo - AI Life OS Brand CSS */
/* Warm sunrise orange - representing sunlight, warmth, and new beginnings */

:root {
  /* Primary: Warm Sunrise Orange */
  --solo-primary-50: #FFF7ED;
  --solo-primary-100: #FFEDD5;
  --solo-primary-200: #FED7AA;
  --solo-primary-300: #FDBA74;
  --solo-primary-400: #FB923C;
  --solo-primary-500: #F97316;
  --solo-primary-600: #EA580C;
  --solo-primary-700: #C2410C;
  --solo-primary-800: #9A3412;
  --solo-primary-900: #7C2D12;

  /* Neutral: Warm Stone */
  --solo-neutral-50: #FAFAF9;
  --solo-neutral-100: #F5F5F4;
  --solo-neutral-200: #E7E5E4;
  --solo-neutral-300: #D6D3D1;
  --solo-neutral-400: #A8A29E;
  --solo-neutral-500: #78716C;
  --solo-neutral-600: #57534E;
  --solo-neutral-700: #44403C;
  --solo-neutral-800: #292524;
  --solo-neutral-900: #1C1917;

  /* Semantic Status Colors */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* Semantic Aliases */
  --solo-background: var(--solo-neutral-50);
  --solo-foreground: var(--solo-neutral-900);
  --solo-card: #FFFFFF;
  --solo-card-foreground: var(--solo-neutral-800);
  --solo-popover: #FFFFFF;
  --solo-popover-foreground: var(--solo-neutral-800);
  --solo-primary: var(--solo-primary-500);
  --solo-primary-foreground: #FFFFFF;
  --solo-muted: var(--solo-neutral-100);
  --solo-muted-foreground: var(--solo-neutral-500);
  --solo-border: var(--solo-neutral-200);
  --solo-input: var(--solo-neutral-200);
  --solo-ring: var(--solo-primary-400);

  /* Radius */
  --solo-radius-sm: 8px;
  --solo-radius-md: 12px;
  --solo-radius-lg: 16px;
  --solo-radius-full: 9999px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

<body class="min-h-screen font-sans antialiased bg-neutral-50">
    <!-- 顶部sticky返回导航 -->
    <header class="sticky top-0 z-40 bg-neutral-50/90 backdrop-blur-md border-b border-border">
      <div class="w-full max-w-md mx-auto flex items-center justify-between px-4 h-12">
        <button type="button" data-dom-id="btn-back" class="w-9 h-9 -ml-2 flex items-center justify-center rounded-full text-foreground active:bg-muted transition-colors">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <h1 class="text-[16px] font-semibold text-foreground">心情日历</h1>
        <button type="button" data-dom-id="btn-trends" class="w-9 h-9 -mr-2 flex items-center justify-center rounded-full text-foreground active:bg-muted transition-colors">
          <i data-lucide="trending-up" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <main class="w-full max-w-md mx-auto px-4 pt-2 pb-8">
      <!-- 月份切换 -->
      <div class="flex justify-center items-center gap-4 py-3">
        <button type="button" class="w-8 h-8 flex items-center justify-center rounded-full text-muted-foreground hover:text-foreground active:bg-muted transition-colors" data-dom-id="btn-prev-month">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <span class="text-[17px] font-semibold text-foreground min-w-[110px] text-center">2026年7月</span>
        <button type="button" class="w-8 h-8 flex items-center justify-center rounded-full text-muted-foreground hover:text-foreground active:bg-muted transition-colors" data-dom-id="btn-next-month">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- 星期标题行 -->
      <div class="grid grid-cols-7 text-center text-xs text-muted-foreground py-2">
        <span>一</span>
        <span>二</span>
        <span>三</span>
        <span>四</span>
        <span>五</span>
        <span>六</span>
        <span>日</span>
      </div>

      <!-- 日历网格 -->
      <div class="grid grid-cols-7 gap-1">
        <!-- 第一行：7月1日是周三，周一二空 -->
        <div class="w-full aspect-square"></div>
        <div class="w-full aspect-square"></div>
        <!-- 1 周三 开心 -->
        <div class="w-full aspect-square rounded-md flex items-center justify-center text-sm bg-primary-100 text-primary font-medium" data-dom-id="day-1">1</div>
        <!-- 2 周四 平静 -->
        <div class="w-full aspect-square rounded-md flex items-center justify-center text-sm bg-amber-100 text-amber-700" data-dom-id="day-2">2</div>
        <!-- 3 周五 开心 -->
        <div class="w-full aspect-square rounded-md flex items-center justify-center text-sm bg-primary-100 text-primary font-medium" data-dom-id="day-3">3</div>
        <!-- 4 周六 开心 -->
        <div class="w-full aspect-square rounded-md flex items-center justify-center text-sm bg-primary-100 text-primary font-medium" data-dom-id="day-4">4</div>
        <!-- 5 周日 开心 -->
        <div class="w-full aspect-square rounded-md flex items-center justify-center text-sm bg-primary-100 text-primary font-medium" data-dom-id="day-5">5</div>

        <!-- 第二行 -->
        <!-- 6 周一 无记录 -->
        <div class="w-full aspect-square rounded-md flex items-center justify-center text-sm text-foreground" data-dom-id="day-6">6</div>
        <!-- 7 周二 平静 -->
        <div class="w-full aspect-square rounded-md flex items-center justify-center text-sm bg-amber-100 text-amber-700" data-dom-id="day-7">7</div>
        <!-- 8 周三 平静 -->
        <div class="w-full aspect-square rounded-md flex items-center justify-center text-sm bg-amber-100 text-amber-700" data-dom-id="day-8">8</div>
        <!-- 9 周四 平静 -->
        <div class="w-full aspect-square rounded-md flex items-center justify-center text-sm bg-amber-100 text-amber-700" data-dom-id="day-9">9</div>
        <!-- 10 周五 低落 -->
        <div class="w-full aspect-square rounded-md flex items-center justify-center text-sm bg-blue-100 text-blue-700" data-dom-id="day-10">10</div>
        <!-- 11 周六 开心 -->
        <div class="w-full aspect-square rounded-md flex items-center justify-center text-sm bg-primary-100 text-primary font-medium" data-dom-id="day-11">11</div>
        <!-- 12 周日 开心 -->
        <div class="w-full aspect-square rounded-md flex items-center justify-center text-sm bg-primary-100 text-primary font-medium" data-dom-id="day-12">12</div>

        <!-- 第三行 -->
        <!-- 13 周一 无记录 -->
        <div class="w-full aspect-square rounded-md flex items-center justify-center text-sm text-foreground" data-dom-id="day-13">13</div>
        <!-- 14 周二 平静 -->
        <div class="w-full aspect-square rounded-md flex items-center justify-center text-sm bg-amber-100 text-amber-700" data-dom-id="day-14">14</div>
        <!-- 15 周三 开心 -->

        <!-- 16 周四 平静 -->
        <div class="w-full aspect-square rounded-md flex items-center justify-center text-sm bg-amber-100 text-amber-700" data-dom-id="day-16">16</div>
        <!-- 17 周五 低落 -->

        <!-- 18 周六 开心 -->

        <!-- 19 周日 开心 -->
