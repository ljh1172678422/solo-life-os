/* Solo - AI Life OS Brand CSS */
/* Warm sunrise orange - representing sunlight, warmth, and new beginnings */

:root {
  /* Primary: Warm Sunrise Orange */
  --solo-primary-50: #FFF7ED;
  --solo-primary-100: #FFEDD5;
  --solo-primary-200: #FED7AA;
  --solo-primary-300: #FDBA74;
  --solo-primary-400: #FB923C;
  --solo-primary-500: #F97316;
  --solo-primary-600: #EA580C;
  --solo-primary-700: #C2410C;
  --solo-primary-800: #9A3412;
  --solo-primary-900: #7C2D12;

  /* Neutral: Warm Stone */
  --solo-neutral-50: #FAFAF9;
  --solo-neutral-100: #F5F5F4;
  --solo-neutral-200: #E7E5E4;
  --solo-neutral-300: #D6D3D1;
  --solo-neutral-400: #A8A29E;
  --solo-neutral-500: #78716C;
  --solo-neutral-600: #57534E;
  --solo-neutral-700: #44403C;
  --solo-neutral-800: #292524;
  --solo-neutral-900: #1C1917;

  /* Semantic Status Colors */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* Semantic Aliases */
  --solo-background: var(--solo-neutral-50);
  --solo-foreground: var(--solo-neutral-900);
  --solo-card: #FFFFFF;
  --solo-card-foreground: var(--solo-neutral-800);
  --solo-popover: #FFFFFF;
  --solo-popover-foreground: var(--solo-neutral-800);
  --solo-primary: var(--solo-primary-500);
  --solo-primary-foreground: #FFFFFF;
  --solo-muted: var(--solo-neutral-100);
  --solo-muted-foreground: var(--solo-neutral-500);
  --solo-border: var(--solo-neutral-200);
  --solo-input: var(--solo-neutral-200);
  --solo-ring: var(--solo-primary-400);

  /* Radius */
  --solo-radius-sm: 8px;
  --solo-radius-md: 12px;
  --solo-radius-lg: 16px;
  --solo-radius-full: 9999px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

@theme inline {
  --color-primary-50: var(--solo-primary-50);
  --color-primary-100: var(--solo-primary-100);
  --color-primary-200: var(--solo-primary-200);
  --color-primary-300: var(--solo-primary-300);
  --color-primary-400: var(--solo-primary-400);

  --color-primary-700: var(--solo-primary-700);
  --color-primary-800: var(--solo-primary-800);
  --color-primary-900: var(--solo-primary-900);
  --color-neutral-50: var(--solo-neutral-50);
  --color-neutral-100: var(--solo-neutral-100);
  --color-neutral-200: var(--solo-neutral-200);
  --color-neutral-300: var(--solo-neutral-300);
  --color-neutral-400: var(--solo-neutral-400);
  --color-neutral-500: var(--solo-neutral-500);
  --color-neutral-600: var(--solo-neutral-600);
  --color-neutral-700: var(--solo-neutral-700);
  --color-neutral-800: var(--solo-neutral-800);
  --color-neutral-900: var(--solo-neutral-900);
  --color-background: var(--solo-background);
  --color-foreground: var(--solo-foreground);
  --color-card: var(--solo-card);
  --color-card-foreground: var(--solo-card-foreground);
  --color-muted: var(--solo-muted);
  --color-muted-foreground: var(--solo-muted-foreground);
  --color-border: var(--solo-border);
  --color-primary: var(--solo-primary);
  --color-primary-foreground: var(--solo-primary-foreground);
  --radius-sm: var(--solo-radius-sm);
  --radius-md: var(--solo-radius-md);
  --radius-lg: var(--solo-radius-lg);
  --radius-full: var(--solo-radius-full);
  --font-sans: var(--font-sans);
}

<body class="min-h-screen font-sans antialiased">
    <main class="w-full max-w-md mx-auto px-4 pt-4 pb-20 space-y-4">

      <!-- 顶部标题区域 -->
      <div class="pt-2">
        <h1 class="text-2xl font-bold text-foreground tracking-tight">成长</h1>
        <p class="text-sm text-muted-foreground mt-1 flex items-center gap-1.5">

          <span>每天进步一点点</span>

      </div>

      <!-- AI今日成长计划卡片 -->
      <div class="bg-card rounded-lg border border-border p-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-base font-semibold text-foreground flex items-center gap-2">

        </div>
        <div class="flex flex-col">
          <label class="flex items-center gap-3 py-3 cursor-pointer active:opacity-70 transition-opacity">
            <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0" style="border-color:var(--solo-neutral-300)">
            </div>
            <div class="min-w-0 flex-1 flex items-center gap-2">
              <i data-lucide="book-open" class="w-4 h-4 shrink-0" style="color:var(--solo-primary-500)"></i>
              <span class="text-sm text-card-foreground truncate">阅读20分钟</span>
            </div>
          </label>
          <div class="w-full h-px bg-border"></div>
          <label class="flex items-center gap-3 py-3 cursor-pointer active:opacity-70 transition-opacity">
            <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0" style="border-color:var(--solo-neutral-300)">
            </div>
            <div class="min-w-0 flex-1 flex items-center gap-2">
              <i data-lucide="footprints" class="w-4 h-4 shrink-0" style="color:var(--solo-primary-500)"></i>
              <span class="text-sm text-card-foreground truncate">跑步3公里</span>
            </div>
          </label>
          <div class="w-full h-px bg-border"></div>
          <label class="flex items-center gap-3 py-3 cursor-pointer active:opacity-70 transition-opacity">

            </div>

            </div>
          </label>
        </div>
      </div>

      <!-- 习惯追踪 - 阅读 -->
      <div class="bg-card rounded-lg border border-border p-4">
        <div class="flex items-center gap-3">
          <!-- 进度环 -->
          <div class="relative w-16 h-16 shrink-0">
            <div class="w-16 h-16 rounded-full flex items-center justify-center" style="background: conic-gradient(var(--solo-primary) 0deg 306deg, var(--solo-neutral-200) 306deg 360deg);">

          </div>
