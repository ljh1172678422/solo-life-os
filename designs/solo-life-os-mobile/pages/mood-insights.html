<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情绪洞察</title>
    <style id="theme-vars">
:root{--solo-primary-50:#FFF7ED;--solo-primary-100:#FFEDD5;--solo-primary-200:#FED7AA;--solo-primary-300:#FDBA74;--solo-primary-400:#FB923C;--solo-primary-500:#F97316;--solo-primary-600:#EA580C;--solo-primary-700:#C2410C;--solo-primary-800:#9A3412;--solo-primary-900:#7C2D12;--solo-neutral-50:#FAFAF9;--solo-neutral-100:#F5F5F4;--solo-neutral-200:#E7E5E4;--solo-neutral-300:#D6D3D1;--solo-neutral-400:#A8A29E;--solo-neutral-500:#78716C;--solo-neutral-600:#57534E;--solo-neutral-700:#44403C;--solo-neutral-800:#292524;--solo-neutral-900:#1C1917;--state-success:#22C55E;--state-warning:#F59E0B;--state-error:#EF4444;--state-info:#3B82F6;--solo-background:var(--solo-neutral-50);--solo-foreground:var(--solo-neutral-900);--solo-card:#FFFFFF;--solo-card-foreground:var(--solo-neutral-800);--solo-popover:#FFFFFF;--solo-popover-foreground:var(--solo-neutral-800);--solo-primary:var(--solo-primary-500);--solo-primary-foreground:#FFFFFF;--solo-muted:var(--solo-neutral-100);--solo-muted-foreground:var(--solo-neutral-500);--solo-border:var(--solo-neutral-200);--solo-input:var(--solo-neutral-200);--solo-ring:var(--solo-primary-400);--solo-radius-sm:8px;--solo-radius-md:12px;--solo-radius-lg:16px;--solo-radius-full:9999px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-full:9999px;--font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
@theme inline{--color-primary-50:var(--solo-primary-50);--color-primary-100:var(--solo-primary-100);--color-primary-200:var(--solo-primary-200);--color-primary-300:var(--solo-primary-300);--color-primary-400:var(--solo-primary-400);--color-primary-500:var(--solo-primary-500);--color-primary-600:var(--solo-primary-600);--color-primary-700:var(--solo-primary-700);--color-primary-800:var(--solo-primary-800);--color-primary-90:var(--solo-primary-900);--color-neutral-50:var(--solo-neutral-50);--color-neutral-100:var(--solo-neutral-100);--color-neutral-200:var(--solo-neutral-200);--color-neutral-300:var(--solo-neutral-300);--color-neutral-400:var(--solo-neutral-400);--color-neutral-500:var(--solo-neutral-500);--color-neutral-600:var(--solo-neutral-600);--color-neutral-700:var(--solo-neutral-700);--color-neutral-800:var(--solo-neutral-800);--color-neutral-900:var(--solo-neutral-900);--color-background:var(--solo-background);--color-foreground:var(--solo-foreground);--color-card:var(--solo-card);--color-card-foreground:var(--solo-card-foreground);--color-muted:var(--solo-muted);--color-muted-foreground:var(--solo-muted-foreground);--color-border:var(--solo-border);--color-primary:var(--solo-primary);--color-primary-foreground:var(--solo-primary-foreground);--radius-sm:var(--solo-radius-sm);--radius-md:var(--solo-radius-md);--radius-lg:var(--solo-radius-lg);--radius-full:var(--solo-radius-full);--font-sans:var(--font-sans)}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">@theme inline{--color-background:var(--solo-background);--color-foreground:var(--solo-foreground);--color-card:var(--solo-card);--color-card-foreground:var(--solo-card-foreground);--color-popover:var(--solo-popover);--color-popover-foreground:var(--solo-popover-foreground);--color-primary:var(--solo-primary);--color-primary-foreground:var(--solo-primary-foreground);--color-muted:var(--solo-muted);--color-muted-foreground:var(--solo-muted-foreground);--color-border:var(--solo-border);--color-input:var(--solo-input);--color-ring:var(--solo-ring);--radius-sm:var(--solo-radius-sm);--radius-md:var(--solo-radius-md);--radius-lg:var(--solo-radius-lg)}@layer base{body{background:var(--solo-background);color:var(--solo-foreground)}td,th{@apply break-words;word-break:break-all;word-break:auto-phrase}th{@apply whitespace-nowrap}}</style>
    <style id="semantic-token-fallback">.bg-background{background-color:var(--solo-background)}.text-background{color:var(--solo-background)}.border-background{border-color:var(--solo-background)}.bg-foreground{background-color:var(--solo-foreground)}.text-foreground{color:var(--solo-foreground)}.border-foreground{border-color:var(--solo-foreground)}.bg-card{background-color:var(--solo-card)}.text-card{color:var(--solo-card)}.border-card{border-color:var(--solo-card)}.bg-primary{background-color:var(--solo-primary)}.text-primary{color:var(--solo-primary)}.border-primary{border-color:var(--solo-primary)}.bg-primary-foreground{background-color:var(--solo-primary-foreground)}.text-primary-foreground{color:var(--solo-primary-foreground)}.bg-muted{background-color:var(--solo-muted)}.text-muted{color:var(--solo-muted)}.bg-muted-foreground{background-color:var(--solo-muted-foreground)}.text-muted-foreground{color:var(--solo-muted-foreground)}.bg-border{background-color:var(--solo-border)}.text-border{color:var(--solo-border)}.border-border{border-color:var(--solo-border)}</style>
    <style>.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}[data-icon]{display:inline-flex;align-items:center;justify-content:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;background-color:currentColor}.period-tab{transition:all 0.2s ease}.period-tab.active{background-color:var(--solo-primary-500);color:#FFFFFF;}.period-tab:not(.active):active{background-color:var(--solo-muted);}</style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="w-full max-w-md mx-auto px-4 pb-6 min-h-screen space-y-4">

        <!-- Back Nav -->
        <nav class="sticky top-0 z-50 -mx-4 px-4 bg-white/95 backdrop-blur-md border-b border-border h-12 flex items-center">
            <a href="mood.html" data-dom-id="btn-back" class="inline-flex items-center justify-center w-9 h-9 -ml-2 rounded-full active:bg-muted transition-colors">
                <i data-lucide="chevron-left" class="w-5 h-5 text-foreground"></i>
            </a>
            <h1 class="flex-1 text-center text-base font-semibold text-foreground -ml-9">情绪洞察</h1>
        </nav>

        <!-- Period Selector -->
        <div class="flex gap-1 p-1 bg-muted rounded-lg">
            <button class="period-tab active flex-1 h-8 rounded-md text-sm font-medium text-center">本周</button>
            <button class="period-tab flex-1 h-8 rounded-md text-sm font-medium text-center text-muted-foreground">本月</button>
            <button class="period-tab flex-1 h-8 rounded-md text-sm font-medium text-center text-muted-foreground">今年</button>
        </div>

        <!-- Mood Overview Card -->
        <div class="bg-card rounded-2xl border border-border p-5 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 rounded-full opacity-10" style="background:radial-gradient(circle,var(--solo-primary-400) 0%,transparent 70%);transform:translate(30%,-30%);"></div>
            <p class="text-sm text-muted-foreground">本周情绪指数</p>
            <div class="flex items-end gap-2 mt-1">
                <span class="text-4xl font-bold text-foreground">78</span>
                <span class="text-lg text-muted-foreground mb-1">分</span>
            </div>
            <div class="flex items-center gap-1.5 mt-2">
                <i data-lucide="trending-up" class="w-3.5 h-3.5 text-state-success"></i>
                <span class="text-xs text-state-success font-medium">比上周 ↑12分</span>
                <span class="text-xs text-muted-foreground">，整体状态不错</span>
            </div>
        </div>

        <!-- Mood Trend Chart -->
        <div class="bg-card rounded-xl border border-border p-4">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-semibold text-foreground">情绪趋势</h3>
                <span class="text-xs text-muted-foreground">近7天</span>
            </div>
            <div class="h-40 flex items-end justify-between gap-2 px-1 relative">
                <!-- Grid lines -->
                <div class="absolute inset-0 flex flex-col justify-between pointer-events-none">
                    <div class="border-b border-dashed border-border/50"></div>
                    <div class="border-b border-dashed border-border/50"></div>
                    <div class="border-b border-dashed border-border/50"></div>
                    <div class="border-b border-dashed border-border/50"></div>
                </div>
                <!-- Bars -->
                <div class="relative flex-1 flex flex-col items-center gap-1.5 z-10 h-full justify-end">
                    <div class="w-full rounded-t-md" style="height:55%;background-color:var(--state-warning);"></div>
                    <span class="text-xs text-muted-foreground">一</span>
                </div>
                <div class="relative flex-1 flex flex-col items-center gap-1.5 z-10 h-full justify-end">
                    <div class="w-full rounded-t-md" style="height:40%;background-color:var(--state-error);opacity:0.7;"></div>
                    <span class="text-xs text-muted-foreground">二</span>
                </div>
                <div class="relative flex-1 flex flex-col items-center gap-1.5 z-10 h-full justify-end">
                    <div class="w-full rounded-t-md" style="height:30%;background-color:var(--state-error);opacity:0.6;"></div>
                    <span class="text-xs text-muted-foreground">三</span>
                </div>
                <div class="relative flex-1 flex flex-col items-center gap-1.5 z-10 h-full justify-end">
                    <div class="w-full rounded-t-md" style="height:65%;background-color:var(--state-warning);"></div>
                    <span class="text-xs text-muted-foreground">四</span>
                </div>
                <div class="relative flex-1 flex flex-col items-center gap-1.5 z-10 h-full justify-end">
                    <div class="w-full rounded-t-md" style="height:85%;background-color:var(--state-success);"></div>
                    <span class="text-xs text-muted-foreground">五</span>
                </div>
                <div class="relative flex-1 flex flex-col items-center gap-1.5 z-10 h-full justify-end">
                    <div class="w-full rounded-t-md" style="height:90%;background-color:var(--state-success);"></div>
                    <span class="text-xs text-muted-foreground">六</span>
                </div>
                <div class="relative flex-1 flex flex-col items-center gap-1.5 z-10 h-full justify-end">
                    <div class="w-full rounded-t-md" style="height:80%;background-color:var(--state-success);"></div>
                    <span class="text-xs text-muted-foreground">日</span>
                </div>
            </div>
            <!-- Legend -->
            <div class="flex items-center justify-center gap-4 mt-3 pt-3 border-t border-border">
                <div class="flex items-center gap-1.5">
                    <div class="w-2.5 h-2.5 rounded-sm" style="background-color:var(--state-success);"></div>
                    <span class="text-xs text-muted-foreground">开心</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <div class="w-2.5 h-2.5 rounded-sm" style="background-color:var(--state-warning);"></div>
                    <span class="text-xs text-muted-foreground">平静</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <div class="w-2.5 h-2.5 rounded-sm" style="background-color:var(--state-error);opacity:0.7;"></div>
                    <span class="text-xs text-muted-foreground">低落</span>
                </div>
            </div>
        </div>

        <!-- AI Insights Section -->
        <div class="space-y-3">
            <div class="flex items-center gap-2 px-1">
                <i data-lucide="sparkles" class="w-4 h-4" style="color:var(--solo-primary-500);"></i>
                <h3 class="text-sm font-semibold text-foreground">AI 发现</h3>
            </div>

            <!-- Insight 1 -->
            <div class="bg-card rounded-xl border border-border p-4 flex gap-3">
                <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0" style="background-color:rgba(239,68,68,0.1);">
                    <i data-lucide="alert-circle" class="w-4 h-4 text-state-error"></i>
                </div>
                <div class="flex-1">
                    <p class="text-sm text-foreground leading-relaxed">你在周三情绪最低落，可能和工作压力有关</p>
                </div>
            </div>

            <!-- Insight 2 -->
            <div class="bg-card rounded-xl border border-border p-4 flex gap-3">
                <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0" style="background-color:rgba(34,197,94,0.1);">
                    <i data-lucide="sun" class="w-4 h-4 text-state-success"></i>
                </div>
                <div class="flex-1">
                    <p class="text-sm text-foreground leading-relaxed">户外活动那天你心情最好 <span>☀️</span></p>
                </div>
            </div>

            <!-- Insight 3 -->
            <div class="rounded-xl p-4 flex gap-3" style="background-color:var(--solo-primary-50);border:1px solid var(--solo-primary-100);">
                <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0" style="background-color:var(--solo-primary-100);">
                    <i data-lucide="lightbulb" class="w-4 h-4" style="color:var(--solo-primary-600);"></i>
                </div>
                <div class="flex-1">
                    <p class="text-sm font-medium mb-0.5" style="color:var(--solo-primary-900);">建议</p>
                    <p class="text-sm leading-relaxed" style="color:var(--solo-primary-800);">本周四下午适合安排一次散步</p>
                </div>
            </div>
        </div>

        <!-- Mood Distribution -->
        <div class="bg-card rounded-xl border border-border p-4">
            <h3 class="text-sm font-semibold text-foreground mb-3">本月情绪分布</h3>
            <div class="grid grid-cols-3 gap-3">
                <div class="text-center p-3 rounded-lg bg-muted/50">
                    <div class="text-2xl mb-1">😊</div>
                    <p class="text-lg font-bold text-foreground">8</p>
                    <p class="text-xs text-muted-foreground">开心</p>
                </div>
                <div class="text-center p-3 rounded-lg bg-muted/50">
                    <div class="text-2xl mb-1">😐</div>
                    <p class="text-lg font-bold text-foreground">12</p>
                    <p class="text-xs text-muted-foreground">平静</p>
                </div>
                <div class="text-center p-3 rounded-lg bg-muted/50">
                    <div class="text-2xl mb-1">😔</div>
                    <p class="text-lg font-bold text-foreground">3</p>
                    <p class="text-xs text-muted-foreground">低落</p>
                </div>
            </div>
            <!-- Distribution bar -->
            <div class="mt-3 flex h-2 rounded-full overflow-hidden bg-muted">
                <div style="width:34.8%;background-color:var(--state-success);"></div>
                <div style="width:52.2%;background-color:var(--state-warning);"></div>
                <div style="width:13.0%;background-color:var(--state-error);opacity:0.7;"></div>
            </div>
        </div>

    </main>
    <script>
        document.querySelectorAll('.period-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.period-tab').forEach(function(t) {
                    t.classList.remove('active');
                    t.style.color = '';
                });
                this.classList.add('active');
                this.style.color = '';
            });
        });
        lucide.createIcons();
    </script>
</body>
</html>
