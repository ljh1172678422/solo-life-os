<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">

    <title>情绪</title>
    <style id="theme-vars">
/* Solo - AI Life OS Brand CSS */
/* Warm sunrise orange - representing sunlight, warmth, and new beginnings */

:root {
  /* Primary: Warm Sunrise Orange */
  --solo-primary-50: #FFF7ED;
  --solo-primary-100: #FFEDD5;
  --solo-primary-200: #FED7AA;
  --solo-primary-300: #FDBA74;
  --solo-primary-400: #FB923C;
  --solo-primary-500: #F97316;
  --solo-primary-600: #EA580C;
  --solo-primary-700: #C2410C;
  --solo-primary-800: #9A3412;
  --solo-primary-900: #7C2D12;

  /* Neutral: Warm Stone */
  --solo-neutral-50: #FAFAF9;
  --solo-neutral-100: #F5F5F4;
  --solo-neutral-200: #E7E5E4;
  --solo-neutral-300: #D6D3D1;
  --solo-neutral-400: #A8A29E;
  --solo-neutral-500: #78716C;
  --solo-neutral-600: #57534E;
  --solo-neutral-700: #44403C;
  --solo-neutral-800: #292524;
  --solo-neutral-900: #1C1917;

  /* Semantic Status Colors */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* Semantic Aliases */
  --solo-background: var(--solo-neutral-50);
  --solo-foreground: var(--solo-neutral-900);
  --solo-card: #FFFFFF;
  --solo-card-foreground: var(--solo-neutral-800);
  --solo-popover: #FFFFFF;
  --solo-popover-foreground: var(--solo-neutral-800);
  --solo-primary: var(--solo-primary-500);
  --solo-primary-foreground: #FFFFFF;
  --solo-muted: var(--solo-neutral-100);
  --solo-muted-foreground: var(--solo-neutral-500);
  --solo-border: var(--solo-neutral-200);
  --solo-input: var(--solo-neutral-200);
  --solo-ring: var(--solo-primary-400);

  /* Radius */
  --solo-radius-sm: 8px;
  --solo-radius-md: 12px;
  --solo-radius-lg: 16px;
  --solo-radius-full: 9999px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

@theme inline {
  --color-primary-50: var(--solo-primary-50);
  --color-primary-100: var(--solo-primary-100);
  --color-primary-200: var(--solo-primary-200);
  --color-primary-300: var(--solo-primary-300);
  --color-primary-400: var(--solo-primary-400);
  --color-primary-500: var(--solo-primary-500);
  --color-primary-600: var(--solo-primary-600);
  --color-primary-700: var(--solo-primary-700);
  --color-primary-800: var(--solo-primary-800);
  --color-primary-900: var(--solo-primary-900);
  --color-neutral-50: var(--solo-neutral-50);
  --color-neutral-100: var(--solo-neutral-100);
  --color-neutral-200: var(--solo-neutral-200);
  --color-neutral-300: var(--solo-neutral-300);
  --color-neutral-400: var(--solo-neutral-400);
  --color-neutral-500: var(--solo-neutral-500);
  --color-neutral-600: var(--solo-neutral-600);
  --color-neutral-700: var(--solo-neutral-700);
  --color-neutral-800: var(--solo-neutral-800);
  --color-neutral-900: var(--solo-neutral-900);
  --color-background: var(--solo-background);
  --color-foreground: var(--solo-foreground);
  --color-card: var(--solo-card);
  --color-card-foreground: var(--solo-card-foreground);
  --color-muted: var(--solo-muted);
  --color-muted-foreground: var(--solo-muted-foreground);
  --color-border: var(--solo-border);
  --color-primary: var(--solo-primary);
  --color-primary-foreground: var(--solo-primary-foreground);
  --radius-sm: var(--solo-radius-sm);
  --radius-md: var(--solo-radius-md);
  --radius-lg: var(--solo-radius-lg);
  --radius-full: var(--solo-radius-full);
  --font-sans: var(--font-sans);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {

    --color-popover: var(--solo-popover);
    --color-popover-foreground: var(--solo-popover-foreground);
    --color-primary: var(--solo-primary);
    --color-primary-foreground: var(--solo-primary-foreground);
    --color-muted: var(--solo-muted);
    --color-muted-foreground: var(--solo-muted-foreground);
    --color-border: var(--solo-border);
    --color-input: var(--solo-input);
    --color-ring: var(--solo-ring);

  @layer base {

  }

</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto min-h-screen pb-24">
      <!-- 顶部标题区 -->
      <div class="pt-12 px-5">
        <h1 class="text-[28px] font-semibold text-foreground tracking-tight" style="text-wrap: balance; word-break: keep-all; overflow-wrap: break-word;">情绪</h1>
        <p class="text-[15px] text-muted-foreground mt-1.5">今天怎么样？</p>
      </div>

      <!-- 心情选择（核心soul element） -->
      <section class="px-5 mt-8">
        <div class="grid grid-cols-4 gap-2">
          <!-- 不错 -->
          <button type="button" class="flex flex-col items-center gap-2 group" data-dom-id="mood-happy">
            <div class="w-[68px] h-[68px] rounded-full bg-card border border-border flex items-center justify-center text-[30px] transition-all duration-200 active:scale-95 group-hover:border-primary/30">
              <span>😊</span>
            </div>
            <span class="text-xs text-muted-foreground">不错</span>
          </button>
          <!-- 一般 -->
          <button type="button" class="flex flex-col items-center gap-2 group" data-dom-id="mood-neutral">
            <div class="w-[68px] h-[68px] rounded-full bg-card border border-border flex items-center justify-center text-[30px] transition-all duration-200 active:scale-95 group-hover:border-primary/30">
              <span>😐</span>
            </div>
            <span class="text-xs text-muted-foreground">一般</span>
          </button>
          <!-- 有点低落 -->
          <button type="button" class="flex flex-col items-center gap-2 group" data-dom-id="mood-sad">
            <div class="w-[68px] h-[68px] rounded-full bg-card border border-border flex items-center justify-center text-[30px] transition-all duration-200 active:scale-95 group-hover:border-primary/30">
              <span>😔</span>
            </div>
            <span class="text-xs text-muted-foreground">低落</span>
          </button>
          <!-- 有点累（选中态） -->
          <button type="button" class="flex flex-col items-center gap-2" data-dom-id="mood-tired" data-active="true">
            <div class="w-[68px] h-[68px] rounded-full border-2 flex items-center justify-center text-[30px] transition-all duration-200 active:scale-95" style="background-color: var(--solo-primary-50); border-color: var(--solo-primary);">
              <span>😫</span>
            </div>
            <span class="text-xs font-medium" style="color: var(--solo-primary);">有点累</span>
          </button>
        </div>
      </section>

      <!-- AI 观察卡片 -->
      <section class="px-5 mt-7">
        <div class="bg-card rounded-lg border border-border p-5">
          <div class="flex items-center gap-2 mb-2.5">
            <i data-lucide="sparkles" class="w-[15px] h-[15px] shrink-0" style="color: var(--solo-primary);"></i>
            <span class="text-xs font-medium" style="color: var(--solo-primary);">AI 观察</span>
          </div>
          <p class="text-[14px] leading-relaxed" style="color: var(--solo-neutral-700);">最近连续三天工作压力较高，身体和情绪都在悄悄发出信号。记得照顾好自己。</p>
        </div>
      </section>

      <!-- AI 建议卡片（浅橙高亮） -->
      <section class="px-5 mt-4">
        <div class="rounded-lg p-5" style="background-color: var(--solo-primary-50);">
          <div class="flex items-center gap-2">
            <i data-lucide="heart" class="w-[15px] h-[15px] shrink-0" style="color: var(--solo-primary);"></i>
            <h2 class="text-[15px] font-semibold" style="color: var(--solo-foreground);">给你的建议</h2>
          </div>
          <p class="text-[14px] mt-2 mb-4 leading-relaxed" style="color: var(--solo-neutral-600);">今晚不要加班，给自己一点放松的时间。</p>

          <!-- 建议项：行式布局，不嵌套子卡片 -->
          <div>
            <button type="button" class="w-full flex items-center gap-3 py-3 text-left transition-opacity active:opacity-70" data-dom-id="suggest-walk">
              <span class="text-xl w-7 shrink-0 leading-none">🌿</span>
              <span class="flex-1 min-w-0 text-[14px] truncate" style="color: var(--solo-neutral-800);">附近散步路线</span>
              <span class="text-xs shrink-0" style="color: var(--solo-neutral-500);">20分钟</span>
              <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: var(--solo-neutral-400);"></i>
            </button>
            <div class="h-px" style="background-color: var(--solo-primary-100);"></div>
            <button type="button" class="w-full flex items-center gap-3 py-3 text-left transition-opacity active:opacity-70" data-dom-id="suggest-music">
              <span class="text-xl w-7 shrink-0 leading-none">🎵</span>
              <span class="flex-1 min-w-0 text-[14px] truncate" style="color: var(--solo-neutral-800);">听听轻音乐</span>
              <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: var(--solo-neutral-400);"></i>
            </button>
            <div class="h-px" style="background-color: var(--solo-primary-100);"></div>
            <button type="button" class="w-full flex items-center gap-3 py-3 text-left transition-opacity active:opacity-70" data-dom-id="suggest-bath">
              <span class="text-xl w-7 shrink-0 leading-none">🛁</span>
              <span class="flex-1 min-w-0 text-[14px] truncate" style="color: var(--solo-neutral-800);">泡个热水澡</span>
              <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: var(--solo-neutral-400);"></i>
            </button>
          </div>
        </div>
      </section>

      <!-- 本周情绪趋势 -->
      <section class="px-5 mt-6 mb-6">
        <div class="bg-card rounded-lg border border-border p-5">
          <h2 class="text-[15px] font-semibold text-card-foreground mb-5">这一周</h2>

          <!-- CSS 条形图 -->
          <div class="flex items-end justify-between gap-1.5">
            <!-- 周一 不错 -->
            <div class="flex-1 flex flex-col items-center gap-2.5">
              <div class="w-full flex justify-center items-end h-[88px]">
                <div class="w-6 rounded-full transition-all" style="height: 80%; background-color: var(--solo-primary-300);"></div>
              </div>
              <span class="text-[11px]" style="color: var(--solo-neutral-500);">一</span>
            </div>
            <!-- 周二 不错 -->
            <div class="flex-1 flex flex-col items-center gap-2.5">
              <div class="w-full flex justify-center items-end h-[88px]">
                <div class="w-6 rounded-full transition-all" style="height: 76%; background-color: var(--solo-primary-300);"></div>
              </div>
              <span class="text-[11px]" style="color: var(--solo-neutral-500);">二</span>
            </div>
            <!-- 周三 一般 -->
            <div class="flex-1 flex flex-col items-center gap-2.5">
              <div class="w-full flex justify-center items-end h-[88px]">
                <div class="w-6 rounded-full transition-all" style="height: 60%; background-color: var(--solo-primary-400);"></div>
              </div>
              <span class="text-[11px]" style="color: var(--solo-neutral-500);">三</span>
            </div>
            <!-- 周四 开始低落 -->
            <div class="flex-1 flex flex-col items-center gap-2.5">
              <div class="w-full flex justify-center items-end h-[88px]">
                <div class="w-6 rounded-full transition-all" style="height: 44%; background-color: var(--solo-primary-500);"></div>
              </div>
              <span class="text-[11px]" style="color: var(--solo-neutral-500);">四</span>
            </div>
            <!-- 周五 压力高 -->
            <div class="flex-1 flex flex-col items-center gap-2.5">
              <div class="w-full flex justify-center items-end h-[88px]">
                <div class="w-6 rounded-full transition-all" style="height: 38%; background-color: var(--solo-primary-500);"></div>
              </div>
              <span class="text-[11px]" style="color: var(--solo-neutral-500);">五</span>
            </div>
            <!-- 周六 略有恢复 -->
            <div class="flex-1 flex flex-col items-center gap-2.5">
              <div class="w-full flex justify-center items-end h-[88px]">
                <div class="w-6 rounded-full transition-all" style="height: 52%; background-color: var(--solo-primary-400);"></div>
              </div>
              <span class="text-[11px]" style="color: var(--solo-neutral-500);">六</span>
            </div>
            <!-- 周日（今天） 累 -->
            <div class="flex-1 flex flex-col items-center gap-2.5">
              <div class="w-full flex justify-center items-end h-[88px] relative">
                <div class="w-6 rounded-full transition-all" style="height: 34%; background-color: var(--solo-primary-600); box-shadow: 0 0 0 3px var(--solo-primary-100);"></div>
              </div>
              <span class="text-[11px] font-medium" style="color: var(--solo-primary);">日</span>
            </div>
          </div>

          <!-- 图例 -->
          <div class="flex items-center justify-center gap-4 mt-4 pt-3" style="border-top: 1px solid var(--solo-border);">
            <div class="flex items-center gap-1.5">
              <div class="w-2 h-2 rounded-full" style="background-color: var(--solo-primary-300);"></div>
              <span class="text-[11px]" style="color: var(--solo-neutral-500);">不错</span>
            </div>
            <div class="flex items-center gap-1.5">
              <div class="w-2 h-2 rounded-full" style="background-color: var(--solo-primary-400);"></div>
              <span class="text-[11px]" style="color: var(--solo-neutral-500);">一般</span>
            </div>
            <div class="flex items-center gap-1.5">
              <div class="w-2 h-2 rounded-full" style="background-color: var(--solo-primary-600);"></div>
              <span class="text-[11px]" style="color: var(--solo-neutral-500);">低落</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- 底部导航 -->
    <nav data-mobile-nav="global" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-border h-[56px] z-50">
      <div class="w-full max-w-md mx-auto grid grid-cols-6 h-full">
        <a href="today.html" data-nav-key="today" data-dom-id="nav-today" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground">
          <i data-lucide="home" class="w-5 h-5 shrink-0"></i>
          <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">今日</span>
        </a>
        <a href="explore.html" data-nav-key="explore" data-dom-id="nav-explore" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground">
          <i data-lucide="compass" class="w-5 h-5 shrink-0"></i>
          <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">探索</span>
        </a>
        <a href="mood.html" data-nav-key="mood" data-dom-id="nav-mood" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-primary" data-active="true">
          <i data-lucide="smile" class="w-5 h-5 shrink-0"></i>
          <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate font-medium">情绪</span>
        </a>
        <a href="growth.html" data-nav-key="growth" data-dom-id="nav-growth" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground">
          <i data-lucide="trending-up" class="w-5 h-5 shrink-0"></i>
          <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">成长</span>
        </a>
        <a href="community.html" data-nav-key="community" data-dom-id="nav-community" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground">
          <i data-lucide="users" class="w-5 h-5 shrink-0"></i>
          <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">同行</span>
        </a>
        <a href="me.html" data-nav-key="me" data-dom-id="nav-me" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground">
          <i data-lucide="user" class="w-5 h-5 shrink-0"></i>
          <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span>
        </a>
      </div>
    </nav>

    <script>lucide.createIcons();</script>
</body>
</html>
