/* Solo - AI Life OS Brand CSS */
/* Warm sunrise orange - representing sunlight, warmth, and new beginnings */

:root {
  /* Primary: Warm Sunrise Orange */
  --solo-primary-50: #FFF7ED;
  --solo-primary-100: #FFEDD5;
  --solo-primary-200: #FED7AA;
  --solo-primary-300: #FDBA74;
  --solo-primary-400: #FB923C;
  --solo-primary-500: #F97316;
  --solo-primary-600: #EA580C;
  --solo-primary-700: #C2410C;
  --solo-primary-800: #9A3412;
  --solo-primary-900: #7C2D12;

  /* Neutral: Warm Stone */
  --solo-neutral-50: #FAFAF9;
  --solo-neutral-100: #F5F5F4;
  --solo-neutral-200: #E7E5E4;
  --solo-neutral-300: #D6D3D1;
  --solo-neutral-400: #A8A29E;
  --solo-neutral-500: #78716C;
  --solo-neutral-600: #57534E;
  --solo-neutral-700: #44403C;
  --solo-neutral-800: #292524;
  --solo-neutral-900: #1C1917;

  /* Semantic Status Colors */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* Semantic Aliases */
  --solo-background: var(--solo-neutral-50);
  --solo-foreground: var(--solo-neutral-900);
  --solo-card: #FFFFFF;
  --solo-card-foreground: var(--solo-neutral-800);
  --solo-popover: #FFFFFF;
  --solo-popover-foreground: var(--solo-neutral-800);
  --solo-primary: var(--solo-primary-500);
  --solo-primary-foreground: #FFFFFF;
  --solo-muted: var(--solo-neutral-100);
  --solo-muted-foreground: var(--solo-neutral-500);
  --solo-border: var(--solo-neutral-200);
  --solo-input: var(--solo-neutral-200);
  --solo-ring: var(--solo-primary-400);

  /* Radius */
  --solo-radius-sm: 8px;
  --solo-radius-md: 12px;
  --solo-radius-lg: 16px;
  --solo-radius-full: 9999px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

@theme inline {
  --color-primary-50: var(--solo-primary-50);
  --color-primary-100: var(--solo-primary-100);
  --color-primary-200: var(--solo-primary-200);
  --color-primary-300: var(--solo-primary-300);
  --color-primary-400: var(--solo-primary-400);
  --color-primary-500: var(--solo-primary-500);
  --color-primary-600: var(--solo-primary-600);
  --color-primary-700: var(--solo-primary-700);
  --color-primary-800: var(--solo-primary-800);
  --color-primary-900: var(--solo-primary-900);
  --color-neutral-50: var(--solo-neutral-50);
  --color-neutral-100: var(--solo-neutral-100);
  --color-neutral-200: var(--solo-neutral-200);
  --color-neutral-300: var(--solo-neutral-300);
  --color-neutral-400: var(--solo-neutral-400);
  --color-neutral-500: var(--solo-neutral-500);
  --color-neutral-600: var(--solo-neutral-600);
  --color-neutral-700: var(--solo-neutral-700);
  --color-neutral-800: var(--solo-neutral-800);
  --color-neutral-900: var(--solo-neutral-900);
  --color-background: var(--solo-background);
  --color-foreground: var(--solo-foreground);
  --color-card: var(--solo-card);
  --color-card-foreground: var(--solo-card-foreground);
  --color-muted: var(--solo-muted);
  --color-muted-foreground: var(--solo-muted-foreground);
  --color-border: var(--solo-border);
  --color-primary: var(--solo-primary);
  --color-primary-foreground: var(--solo-primary-foreground);
  --radius-sm: var(--solo-radius-sm);
  --radius-md: var(--solo-radius-md);
  --radius-lg: var(--solo-radius-lg);
  --radius-full: var(--solo-radius-full);
  --font-sans: var(--font-sans);
}

<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen w-full max-w-md mx-auto pb-20">
        <!-- Header -->
        <header class="px-4 pt-3 pb-1">
            <h1 class="text-[28px] font-bold tracking-tight leading-tight" style="color: var(--solo-foreground);">探索</h1>
            <p class="text-sm mt-1" style="color: var(--solo-muted-foreground);">今晚适合去哪里</p>
        </header>

        <!-- Category filter pills -->
        <div class="mt-4">
            <div class="flex flex-nowrap overflow-x-auto no-scrollbar gap-2 px-4 pb-1">
                <button class="shrink-0 px-4 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap transition-colors" style="background: var(--solo-primary); color: var(--solo-primary-foreground);">全部</button>
                <button class="shrink-0 px-4 py-1.5 rounded-lg text-sm whitespace-nowrap inline-flex items-center gap-1.5 transition-colors border" style="background: var(--solo-card); border-color: var(--solo-border); color: var(--solo-muted-foreground);">
                    <i data-lucide="coffee" class="w-3.5 h-3.5"></i>咖啡店
                </button>
                <button class="shrink-0 px-4 py-1.5 rounded-lg text-sm whitespace-nowrap inline-flex items-center gap-1.5 transition-colors border" style="background: var(--solo-card); border-color: var(--solo-border); color: var(--solo-muted-foreground);">
                    <i data-lucide="book-open" class="w-3.5 h-3.5"></i>书店
                </button>
                <button class="shrink-0 px-4 py-1.5 rounded-lg text-sm whitespace-nowrap inline-flex items-center gap-1.5 transition-colors border" style="background: var(--solo-card); border-color: var(--solo-border); color: var(--solo-muted-foreground);">
                    <i data-lucide="tree-pine" class="w-3.5 h-3.5"></i>公园
                </button>
                <button class="shrink-0 px-4 py-1.5 rounded-lg text-sm whitespace-nowrap inline-flex items-center gap-1.5 transition-colors border" style="background: var(--solo-card); border-color: var(--solo-border); color: var(--solo-muted-foreground);">
                    <i data-lucide="palette" class="w-3.5 h-3.5"></i>展览
                </button>
                <button class="shrink-0 px-4 py-1.5 rounded-lg text-sm whitespace-nowrap inline-flex items-center gap-1.5 transition-colors border" style="background: var(--solo-card); border-color: var(--solo-border); color: var(--solo-muted-foreground);">
                    <i data-lucide="activity" class="w-3.5 h-3.5"></i>运动
                </button>
                <button class="shrink-0 px-4 py-1.5 rounded-lg text-sm whitespace-nowrap inline-flex items-center gap-1.5 transition-colors border" style="background: var(--solo-card); border-color: var(--solo-border); color: var(--solo-muted-foreground);">
                    <i data-lucide="bike" class="w-3.5 h-3.5"></i>夜骑
                </button>
                <button class="shrink-0 px-4 py-1.5 rounded-lg text-sm whitespace-nowrap inline-flex items-center gap-1.5 transition-colors border" style="background: var(--solo-card); border-color: var(--solo-border); color: var(--solo-muted-foreground);">
                    <i data-lucide="film" class="w-3.5 h-3.5"></i>电影
                </button>
            </div>
        </div>

        <!-- Content -->
        <div class="px-4 space-y-4 mt-4">

            <!-- Hero recommendation card -->
            <article class="rounded-lg border overflow-hidden" style="background: var(--solo-card); border-color: var(--solo-border);">
                <!-- Gradient hero area simulating warm cafe lighting -->
                <div class="h-44 relative" style="background: linear-gradient(155deg, var(--solo-primary-100) 0%, var(--solo-primary-300) 30%, var(--solo-primary-500) 65%, var(--solo-primary-800) 100%);">

                    <div class="absolute top-5 right-6 w-24 h-24 rounded-full" style="background: radial-gradient(circle, rgba(255,247,237,0.45) 0%, transparent 65%);"></div>
                    <div class="absolute bottom-6 left-8 w-16 h-16 rounded-full" style="background: radial-gradient(circle, rgba(255,247,237,0.3) 0%, transparent 65%);"></div>
                    <!-- AI curation badge -->
                    <div class="absolute top-3 left-3 inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium backdrop-blur-sm" style="background: rgba(255,255,255,0.25); color: #fff;">
                        <i data-lucide="sparkles" class="w-3 h-3"></i>AI 今晚推荐
                    </div>
                    <!-- Reason tag -->
                    <div class="absolute bottom-3 right-3 inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] backdrop-blur-sm" style="background: rgba(255,255,255,0.2); color: rgba(255,255,255,0.95);">
                        <i data-lucide="cloud-moon" class="w-3 h-3"></i>今晚适合去
                    </div>
                </div>
                <div class="p-4">
                    <div class="flex items-start justify-between gap-3">
                        <div class="min-w-0 flex-1">

                            <div class="flex items-center gap-0.5 mt-1">
                                <i data-lucide="star" class="w-3.5 h-3.5 fill-current" style="color: var(--state-warning);"></i>
                                <i data-lucide="star" class="w-3.5 h-3.5 fill-current" style="color: var(--state-warning);"></i>
                                <i data-lucide="star" class="w-3.5 h-3.5 fill-current" style="color: var(--state-warning);"></i>
                                <i data-lucide="star" class="w-3.5 h-3.5 fill-current" style="color: var(--state-warning);"></i>
                                <i data-lucide="star" class="w-3.5 h-3.5 fill-current" style="color: var(--state-warning);"></i>
                                <span class="text-xs ml-1" style="color: var(--solo-muted-foreground);">4.9</span>
                            </div>
                        </div>
                        <div class="shrink-0 inline-flex items-center gap-1 text-sm pt-0.5" style="color: var(--solo-muted-foreground);">
                            <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                            <span>步行12分钟</span>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-1.5 mt-3">
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs whitespace-nowrap" style="background: var(--solo-primary-50); color: var(--solo-primary-700);">
                            <i data-lucide="volume-2" class="w-3 h-3"></i>安静
                        </span>
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs whitespace-nowrap" style="background: var(--solo-muted); color: var(--solo-muted-foreground);">
                            <i data-lucide="laptop" class="w-3 h-3"></i>可办公
                        </span>
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs whitespace-nowrap" style="background: var(--solo-muted); color: var(--solo-muted-foreground);">
                            <i data-lucide="user" class="w-3 h-3"></i>一个人不尴尬
                        </span>
                    </div>
                    <p class="text-xs mt-3 leading-relaxed" style="color: var(--solo-muted-foreground);">暖黄灯光、木质桌椅，适合下班后坐一会儿，点一杯手冲慢慢喝。</p>
                </div>
            </article>

            <!-- Section header -->
            <div class="flex items-center justify-between pt-1">
                <h3 class="text-base font-semibold" style="color: var(--solo-foreground);">为你推荐</h3>
                <span class="text-xs" style="color: var(--solo-muted-foreground);">基于此刻心情</span>
            </div>

            <!-- Bookstore card -->
            <article class="rounded-lg border p-4 flex gap-3 active:scale-[0.99] transition-transform" style="background: var(--solo-card); border-color: var(--solo-border);">
                <div class="shrink-0 w-12 h-12 rounded-lg flex items-center justify-center" style="background: var(--solo-primary-50); color: var(--solo-primary);">
                    <i data-lucide="book-open" class="w-5 h-5"></i>
                </div>
                <div class="min-w-0 flex-1">
                    <div class="flex items-start justify-between gap-2">
                        <h4 class="text-sm font-semibold truncate" style="color: var(--solo-foreground);">方所书店</h4>
                        <span class="shrink-0 inline-flex items-center gap-0.5 text-xs whitespace-nowrap pt-0.5" style="color: var(--solo-muted-foreground);">
                            <i data-lucide="clock" class="w-3 h-3"></i>18分钟
                        </span>
                    </div>
                    <p class="text-xs mt-1 truncate" style="color: var(--solo-muted-foreground);">今天营业到 22:00</p>
                    <div class="flex flex-wrap gap-1.5 mt-2">
                        <span class="px-2 py-0.5 rounded text-[11px] whitespace-nowrap" style="background: var(--solo-muted); color: var(--solo-muted-foreground);">有新书上架</span>
                        <span class="px-2 py-0.5 rounded text-[11px] whitespace-nowrap" style="background: var(--solo-primary-50); color: var(--solo-primary-700);">适合发呆</span>
                    </div>
                </div>
            </article>

            <!-- Night ride card -->
            <article class="rounded-lg border p-4 flex gap-3 active:scale-[0.99] transition-transform" style="background: var(--solo-card); border-color: var(--solo-border);">
                <div class="shrink-0 w-12 h-12 rounded-lg flex items-center justify-center" style="background: var(--solo-primary-50); color: var(--solo-primary);">
                    <i data-lucide="bike" class="w-5 h-5"></i>
                </div>
                <div class="min-w-0 flex-1">
                    <div class="flex items-start justify-between gap-2">
                        <h4 class="text-sm font-semibold truncate" style="color: var(--solo-foreground);">西湖夜骑</h4>
                        <span class="shrink-0 inline-flex items-center gap-0.5 text-xs whitespace-nowrap pt-0.5" style="color: var(--solo-muted-foreground);">
                            <i data-lucide="route" class="w-3 h-3"></i>8km 环线
                        </span>
                    </div>
                    <p class="text-xs mt-1 truncate" style="color: var(--solo-muted-foreground);">今晚有风，体感舒适</p>
                    <div class="flex flex-wrap gap-1.5 mt-2">
                        <span class="px-2 py-0.5 rounded text-[11px] whitespace-nowrap" style="background: var(--solo-muted); color: var(--solo-muted-foreground);">路灯充足</span>
                        <span class="px-2 py-0.5 rounded text-[11px] whitespace-nowrap" style="background: var(--solo-primary-50); color: var(--solo-primary-700);">微风 24°C</span>
                    </div>
                </div>
            </article>

            <!-- Park card -->
            <article class="rounded-lg border p-4 flex gap-3 active:scale-[0.99] transition-transform" style="background: var(--solo-card); border-color: var(--solo-border);">

                        <span class="shrink-0 inline-flex items-center gap-0.5 text-xs whitespace-nowrap pt-0.5" style="color: var(--solo-muted-foreground);">

                        </span>
                    </div>
                    <p class="text-xs mt-1 truncate" style="color: var(--solo-muted-foreground);">今晚有晚霞，适合散步</p>
                    <div class="flex flex-wrap gap-1.5 mt-2">
                        <span class="px-2 py-0.5 rounded text-[11px] whitespace-nowrap" style="background: var(--solo-muted); color: var(--solo-muted-foreground);">人少安静</span>
                        <span class="px-2 py-0.5 rounded text-[11px] whitespace-nowrap" style="background: var(--solo-primary-50); color: var(--solo-primary-700);">日落绝佳</span>
                    </div>
                </div>
            </article>

        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav data-mobile-nav="global" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-border h-[56px] z-50">
      <div class="w-full max-w-md mx-auto grid grid-cols-6 h-full">
        <a href="today.html" data-nav-key="today" data-dom-id="nav-today" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground">
          <i data-lucide="home" class="w-5 h-5 shrink-0"></i>
