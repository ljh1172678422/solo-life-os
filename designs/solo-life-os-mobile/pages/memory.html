<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的回忆</title>
    <style id="theme-vars">
/* Solo - AI Life OS Brand CSS */
/* Warm sunrise orange - representing sunlight, warmth, and new beginnings */

:root {
  /* Primary: Warm Sunrise Orange */
  --solo-primary-50: #FFF7ED;
  --solo-primary-100: #FFEDD5;
  --solo-primary-200: #FED7AA;
  --solo-primary-300: #FDBA74;
  --solo-primary-400: #FB923C;
  --solo-primary-500: #F97316;
  --solo-primary-600: #EA580C;
  --solo-primary-700: #C2410C;
  --solo-primary-800: #9A3412;
  --solo-primary-900: #7C2D12;

  /* Neutral: Warm Stone */
  --solo-neutral-50: #FAFAF9;
  --solo-neutral-100: #F5F5F4;
  --solo-neutral-200: #E7E5E4;
  --solo-neutral-300: #D6D3D1;
  --solo-neutral-400: #A8A29E;
  --solo-neutral-500: #78716C;
  --solo-neutral-600: #57534E;
  --solo-neutral-700: #44403C;
  --solo-neutral-800: #292524;
  --solo-neutral-900: #1C1917;

  /* Semantic Status Colors */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* Semantic Aliases */
  --solo-background: var(--solo-neutral-50);
  --solo-foreground: var(--solo-neutral-900);
  --solo-card: #FFFFFF;
  --solo-card-foreground: var(--solo-neutral-800);
  --solo-popover: #FFFFFF;
  --solo-popover-foreground: var(--solo-neutral-800);
  --solo-primary: var(--solo-primary-500);
  --solo-primary-foreground: #FFFFFF;
  --solo-muted: var(--solo-neutral-100);
  --solo-muted-foreground: var(--solo-neutral-500);
  --solo-border: var(--solo-neutral-200);
  --solo-input: var(--solo-neutral-200);
  --solo-ring: var(--solo-primary-400);

  /* Radius */
  --solo-radius-sm: 8px;
  --solo-radius-md: 12px;
  --solo-radius-lg: 16px;
  --solo-radius-full: 9999px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

@theme inline {
  --color-primary-50: var(--solo-primary-50);
  --color-primary-100: var(--solo-primary-100);
  --color-primary-200: var(--solo-primary-200);
  --color-primary-300: var(--solo-primary-300);
  --color-primary-400: var(--solo-primary-400);
  --color-primary-500: var(--solo-primary-500);
  --color-primary-600: var(--solo-primary-600);
  --color-primary-700: var(--solo-primary-700);
  --color-primary-800: var(--solo-primary-800);
  --color-primary-900: var(--solo-primary-900);
  --color-neutral-50: var(--solo-neutral-50);
  --color-neutral-100: var(--solo-neutral-100);
  --color-neutral-200: var(--solo-neutral-200);
  --color-neutral-300: var(--solo-neutral-300);
  --color-neutral-400: var(--solo-neutral-400);
  --color-neutral-500: var(--solo-neutral-500);
  --color-neutral-600: var(--solo-neutral-600);
  --color-neutral-700: var(--solo-neutral-700);
  --color-neutral-800: var(--solo-neutral-800);
  --color-neutral-900: var(--solo-neutral-900);
  --color-background: var(--solo-background);
  --color-foreground: var(--solo-foreground);
  --color-card: var(--solo-card);
  --color-card-foreground: var(--solo-card-foreground);
  --color-muted: var(--solo-muted);
  --color-muted-foreground: var(--solo-muted-foreground);
  --color-border: var(--solo-border);
  --color-primary: var(--solo-primary);
  --color-primary-foreground: var(--solo-primary-foreground);
  --radius-sm: var(--solo-radius-sm);
  --radius-md: var(--solo-radius-md);
  --radius-lg: var(--solo-radius-lg);
  --radius-full: var(--solo-radius-full);
  --font-sans: var(--font-sans);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--solo-background);
    --color-foreground: var(--solo-foreground);
    --color-card: var(--solo-card);
    --color-card-foreground: var(--solo-card-foreground);
    --color-popover: var(--solo-popover);
    --color-popover-foreground: var(--solo-popover-foreground);
    --color-primary: var(--solo-primary);
    --color-primary-foreground: var(--solo-primary-foreground);
    --color-muted: var(--solo-muted);
    --color-muted-foreground: var(--solo-muted-foreground);
    --color-border: var(--solo-border);
    --color-input: var(--solo-input);
    --color-ring: var(--solo-ring);
    --radius-sm: var(--solo-radius-sm);
    --radius-md: var(--solo-radius-md);
    --radius-lg: var(--solo-radius-lg);
  }
  @layer base {
    body { background: var(--solo-background); color: var(--solo-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;

</head>
<body class="min-h-screen font-sans antialiased">
    <main class="w-full max-w-md mx-auto px-4 pb-6 min-h-screen space-y-6">
      <!-- 顶部返回导航栏 -->
      <nav class="sticky top-0 z-50 -mx-4 px-4 bg-white/95 backdrop-blur-md border-b border-border h-12 flex items-center">
        <a href="me.html" data-dom-id="btn-back" class="inline-flex items-center justify-center w-9 h-9 -ml-2 rounded-full active:bg-muted transition-colors">
          <i data-lucide="chevron-left" class="w-5 h-5 text-foreground"></i>
        </a>
        <h1 class="flex-1 text-center text-base font-semibold text-foreground -ml-9">我的回忆</h1>
      </nav>

      <!-- 顶部区域 -->
      <div class="flex flex-col gap-1">
        <h1 class="text-2xl font-semibold text-foreground leading-tight" style="text-wrap:balance;word-break:keep-all;overflow-wrap:break-word;">我的回忆</h1>
        <p class="text-sm text-muted-foreground leading-tight">你的生活，值得被记住</p>
      </div>

      <!-- AI 年度总结卡片 (soul element) -->
      <div class="rounded-lg p-5 relative overflow-hidden" style="background: linear-gradient(135deg, var(--solo-primary-100) 0%, var(--solo-primary-50) 100%);">
        <!-- 装饰性暖色渐变区域（左侧） -->
        <div class="absolute top-0 right-0 w-32 h-32 rounded-full opacity-40" style="background: radial-gradient(circle, var(--solo-primary-200) 0%, transparent 70%); transform: translate(30%, -30%);"></div>
        <div class="relative flex flex-col gap-3">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-md flex items-center justify-center shrink-0" style="background-color:var(--solo-primary-500)">
              <i data-lucide="sparkles" class="w-4 h-4 text-white"></i>
            </div>
            <span class="text-xs font-medium" style="color:var(--solo-primary-700)">AI 总结 · 2026年</span>
          </div>
          <p class="text-lg font-semibold text-foreground leading-snug">今年你比去年多笑了 12 天</p>
          <div class="flex flex-col gap-1.5">
            <div class="flex items-center gap-2">
              <i data-lucide="map-pin" class="w-3.5 h-3.5 shrink-0" style="color:var(--solo-primary-500)"></i>
              <span class="text-sm" style="color:var(--solo-neutral-700)">探索了 23 个新地方</span>
            </div>
            <div class="flex items-center gap-2">
              <i data-lucide="users" class="w-3.5 h-3.5 shrink-0" style="color:var(--solo-primary-500)"></i>
              <span class="text-sm" style="color:var(--solo-neutral-700)">认识了 8 个有趣的人</span>
            </div>
          </div>
          <p class="text-sm font-medium" style="color:var(--solo-primary-600)">继续加油 💛</p>
        </div>
      </div>

      <!-- 时间轴 -->
      <div class="relative pl-6">
        <!-- 竖线 -->
        <div class="absolute left-[5px] top-2 bottom-2 w-0.5" style="background-color:var(--solo-primary-200)"></div>

        <!-- 时间轴项1：去年今天 -->
        <div class="relative pb-6">
          <!-- 圆点 -->
          <div class="absolute -left-[22px] top-1 w-3 h-3 rounded-full border-2 border-white z-10" style="background-color:var(--solo-primary-500)"></div>
          <div class="flex items-start gap-3">
            <div class="min-w-0 flex-1">
              <span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium mb-1.5" style="background-color:var(--solo-primary-100);color:var(--solo-primary-700)">去年今天</span>
              <p class="text-base font-semibold text-foreground leading-snug">你去了西湖</p>
              <p class="text-sm text-muted-foreground mt-1 leading-relaxed">那天阳光很好，你拍了 12 张照片</p>
            </div>
            <!-- 照片占位 -->
            <div class="w-16 h-16 rounded-md shrink-0 flex items-center justify-center" style="background-color:var(--solo-neutral-200)">
              <i data-lucide="image" class="w-6 h-6" style="color:var(--solo-neutral-400)"></i>
            </div>
          </div>
        </div>

        <!-- 时间轴项2：3个月前 -->
        <div class="relative pb-6">
          <div class="absolute -left-[22px] top-1 w-3 h-3 rounded-full border-2 border-white z-10" style="background-color:var(--solo-primary-400)"></div>
          <div class="flex flex-col">
            <span class="text-xs font-medium mb-1" style="color:var(--solo-neutral-500)">3个月前</span>
            <div class="flex items-center gap-2 mb-1">
              <i data-lucide="activity" class="w-4 h-4 shrink-0" style="color:var(--solo-primary-500)"></i>
              <p class="text-base font-semibold text-foreground leading-snug">第一次跑 10km</p>
            </div>
            <p class="text-sm text-muted-foreground leading-relaxed">你说"没想到自己能做到"</p>
          </div>
        </div>

        <!-- 时间轴项3：今年春天 -->
        <div class="relative pb-6">
          <div class="absolute -left-[22px] top-1 w-3 h-3 rounded-full border-2 border-white z-10" style="background-color:var(--solo-primary-400)"></div>
          <div class="flex flex-col">
            <span class="text-xs font-medium mb-1" style="color:var(--solo-neutral-500)">今年 3 月</span>
            <div class="flex items-center gap-2 mb-1">
              <i data-lucide="user-plus" class="w-4 h-4 shrink-0" style="color:var(--solo-primary-500)"></i>
              <p class="text-base font-semibold text-foreground leading-snug">认识了 6 个新朋友</p>
            </div>
            <p class="text-sm text-muted-foreground leading-relaxed">都是在 City Walk 时遇到的</p>
          </div>
        </div>

        <!-- 时间轴项4：上周 -->
        <div class="relative">
          <div class="absolute -left-[22px] top-1 w-3 h-3 rounded-full border-2 border-white z-10" style="background-color:var(--solo-primary-300)"></div>
          <div class="flex items-start gap-3">
            <div class="min-w-0 flex-1">
              <span class="text-xs font-medium mb-1 block" style="color:var(--solo-neutral-500)">上周六</span>
              <div class="flex items-center gap-2 mb-1">
                <i data-lucide="palette" class="w-4 h-4 shrink-0" style="color:var(--solo-primary-500)"></i>
                <p class="text-base font-semibold text-foreground leading-snug">一个人去看了展览</p>
              </div>
              <p class="text-sm text-muted-foreground leading-relaxed">待了整整 3 个小时</p>
            </div>
            <!-- 照片占位 -->
            <div class="w-16 h-16 rounded-md shrink-0 flex items-center justify-center" style="background: linear-gradient(135deg, var(--solo-primary-100), var(--solo-neutral-200))">
              <i data-lucide="image" class="w-6 h-6" style="color:var(--solo-neutral-400)"></i>
            </div>
          </div>
        </div>
      </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
