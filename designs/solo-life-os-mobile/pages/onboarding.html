/* Solo - AI Life OS Brand CSS */
/* Warm sunrise orange - representing sunlight, warmth, and new beginnings */

:root {
  /* Primary: Warm Sunrise Orange */
  --solo-primary-50: #FFF7ED;
  --solo-primary-100: #FFEDD5;
  --solo-primary-200: #FED7AA;
  --solo-primary-300: #FDBA74;
  --solo-primary-400: #FB923C;
  --solo-primary-500: #F97316;
  --solo-primary-600: #EA580C;
  --solo-primary-700: #C2410C;
  --solo-primary-800: #9A3412;
  --solo-primary-900: #7C2D12;

  /* Neutral: Warm Stone */
  --solo-neutral-50: #FAFAF9;
  --solo-neutral-100: #F5F5F4;
  --solo-neutral-200: #E7E5E4;
  --solo-neutral-300: #D6D3D1;
  --solo-neutral-400: #A8A29E;
  --solo-neutral-500: #78716C;
  --solo-neutral-600: #57534E;
  --solo-neutral-700: #44403C;
  --solo-neutral-800: #292524;
  --solo-neutral-900: #1C1917;

  /* Semantic Status Colors */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* Semantic Aliases */
  --solo-background: var(--solo-neutral-50);
  --solo-foreground: var(--solo-neutral-900);
  --solo-card: #FFFFFF;
  --solo-card-foreground: var(--solo-neutral-800);
  --solo-popover: #FFFFFF;
  --solo-popover-foreground: var(--solo-neutral-800);
  --solo-primary: var(--solo-primary-500);
  --solo-primary-foreground: #FFFFFF;
  --solo-muted: var(--solo-neutral-100);
  --solo-muted-foreground: var(--solo-neutral-500);
  --solo-border: var(--solo-neutral-200);
  --solo-input: var(--solo-neutral-200);
  --solo-ring: var(--solo-primary-400);

  /* Radius */
  --solo-radius-sm: 8px;
  --solo-radius-md: 12px;
  --solo-radius-lg: 16px;
  --solo-radius-full: 9999px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      .onboard-section {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #FFFFFF;
        position: relative;
      }
      .onboard-emoji {
        width: 96px;
        height: 96px;
        margin-left: auto;
        margin-right: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 64px;
        line-height: 1;
      }
      .ob-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 9px 20px;
        border-radius: 9999px;
        font-size: 14px;
        border: 1px solid var(--solo-border);
        background: #FFFFFF;
        color: var(--solo-foreground);
        cursor: pointer;
        transition: all 150ms cubic-bezier(.2,.8,.2,1);
        user-select: none;
      }
      .ob-chip:active {
        transform: scale(0.96);
      }
      .ob-chip.selected {
        background: var(--solo-primary-50);
        border-color: var(--solo-primary);
        color: var(--solo-primary);
        font-weight: 500;
      }
      .page-dots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .page-dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: var(--solo-neutral-200);
        transition: all 200ms ease;
      }
      .page-dot.active {
        background: var(--solo-primary);
        width: 20px;
      }
      .btn-primary-full {
        width: 100%;
        background: var(--solo-primary);
        color: #FFFFFF;
        border-radius: 9999px;
        padding-top: 14px;
        padding-bottom: 14px;
        font-weight: 500;
        font-size: 15px;
        border: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: opacity 150ms cubic-bezier(.2,.8,.2,1), transform 150ms cubic-bezier(.2,.8,.2,1);
      }
      .btn-primary-full:active {
        opacity: 0.88;
        transform: scale(0.98);
      }
      .btn-skip {
        background: transparent;
        border: none;
        color: var(--solo-muted-foreground);
        font-size: 14px;
        cursor: pointer;
        padding: 6px 4px;
        transition: color 150ms ease;
      }
      .btn-skip:active {
        color: var(--solo-primary);
      }
    </style>

<body class="min-h-screen font-sans antialiased" style="background:#FFFFFF;">
    <main class="w-full bg-white">

      <!-- Section 1 -->
      <section class="onboard-section">
        <div class="flex justify-end items-center pt-12 px-6">
          <button data-dom-id="btn-skip" class="btn-skip">跳过</button>
        </div>
        <div class="pt-24 px-8 text-center flex-1 flex flex-col items-center">
          <div class="onboard-emoji">☀️</div>
          <h2 class="text-2xl font-bold mt-6" style="color:var(--solo-foreground);">今天，过得值得一点</h2>
          <p class="mt-3 text-[15px] leading-relaxed" style="color:var(--solo-muted-foreground);">不用刷攻略，不用做计划，AI帮你决定今天做什么</p>
        </div>
        <div class="page-dots pb-10">
          <span class="page-dot active"></span>
          <span class="page-dot"></span>
          <span class="page-dot"></span>
          <span class="page-dot"></span>
        </div>
      </section>

      <!-- Section 2 -->
      <section class="onboard-section">
        <div class="pt-12 px-8 text-center flex-1 flex flex-col items-center">
          <div class="onboard-emoji">🌿</div>
          <h2 class="text-2xl font-bold mt-6" style="color:var(--solo-foreground);">一个人，也能过得很精彩</h2>
          <p class="mt-3 text-[15px] leading-relaxed" style="color:var(--solo-muted-foreground);">附近的好咖啡、适合散步的公园、今晚的电影，都帮你找好了</p>
        </div>
        <div class="page-dots pb-10">
          <span class="page-dot"></span>
          <span class="page-dot active"></span>
          <span class="page-dot"></span>
          <span class="page-dot"></span>
        </div>
      </section>

      <!-- Section 3 -->

          <h2 class="text-2xl font-bold mt-6" style="color:var(--solo-foreground);">出去生活吧</h2>
          <p class="mt-3 text-[15px] leading-relaxed" style="color:var(--solo-muted-foreground);">我们不抢你的时间，而是帮你更好地放下手机</p>
        </div>

      <!-- Section 4: Preference Selection -->
      <section class="onboard-section">
        <div class="pt-12 px-8 flex-1">
          <h2 class="text-xl font-bold text-center" style="color:var(--solo-foreground);">告诉我几个小偏好</h2>

          <!-- Question 1 -->
          <div class="mt-6">
            <p class="text-sm mb-2" style="color:var(--solo-muted-foreground);">你更喜欢？</p>
            <div class="flex flex-wrap gap-2">
              <span class="ob-chip selected">出门走走</span>
              <span class="ob-chip">宅在家</span>

          </div>

            <p class="text-sm mb-2" style="color:var(--solo-muted-foreground);">节奏？</p>
            <div class="flex flex-wrap gap-2">
              <span class="ob-chip">慢</span>
              <span class="ob-chip selected">适中</span>
              <span class="ob-chip">充实</span>
            </div>
          </div>

          <button data-dom-id="btn-start" class="btn-primary-full mt-8">开始</button>
        </div>
        <div class="page-dots pb-10">
          <span class="page-dot"></span>
          <span class="page-dot"></span>
          <span class="page-dot"></span>
          <span class="page-dot active"></span>
        </div>
      </section>

    </main>
    <script>
      // Chip toggle interaction
      document.querySelectorAll('.ob-chip').forEach(chip => {
        chip.addEventListener('click', function() {
          const group = this.parentElement;
          group.querySelectorAll('.ob-chip').forEach(c => c.classList.remove('selected'));
          this.classList.add('selected');
        });
      });
      lucide.createIcons();
    </script>
</body>
</html>
