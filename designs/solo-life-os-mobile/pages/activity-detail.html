<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动详情</title>
    <style id="theme-vars">
:root {
  --solo-primary-50: #FFF7ED; --solo-primary-100: #FFEDD5; --solo-primary-200: #FED7AA; --solo-primary-300: #FDBA74;
  --solo-primary-400: #FB923C; --solo-primary-500: #F97316; --solo-primary-600: #EA580C; --solo-primary-700: #C2410C;
  --solo-primary-800: #9A3412; --solo-primary-900: #7C2D12;
  --solo-neutral-50: #FAFAF9; --solo-neutral-100: #F5F5F4; --solo-neutral-200: #E7E5E4; --solo-neutral-300: #D6D3D1;
  --solo-neutral-400: #A8A29E; --solo-neutral-500: #78716C; --solo-neutral-600: #57534E; --solo-neutral-700: #44403C;
  --solo-neutral-800: #292524; --solo-neutral-900: #1C1917;
  --state-success: #22C55E; --state-warning: #F59E0B; --state-error: #EF4444; --state-info: #3B82F6;
  --solo-background: var(--solo-neutral-50); --solo-foreground: var(--solo-neutral-900); --solo-card: #FFFFFF;
  --solo-card-foreground: var(--solo-neutral-800); --solo-popover: #FFFFFF; --solo-popover-foreground: var(--solo-neutral-800);
  --solo-primary: var(--solo-primary-500); --solo-primary-foreground: #FFFFFF;
  --solo-muted: var(--solo-neutral-100); --solo-muted-foreground: var(--solo-neutral-500);
  --solo-border: var(--solo-neutral-200); --solo-input: var(--solo-neutral-200); --solo-ring: var(--solo-primary-400);
  --solo-radius-sm: 8px; --solo-radius-md: 12px; --solo-radius-lg: 16px; --solo-radius-full: 9999px;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
@theme inline {
  --color-primary-50:var(--solo-primary-50);--color-primary-100:var(--solo-primary-100);--color-primary-200:var(--solo-primary-200);--color-primary-300:var(--solo-primary-300);--color-primary-400:var(--solo-primary-400);--color-primary-500:var(--solo-primary-500);--color-primary-600:var(--solo-primary-600);--color-primary-700:var(--solo-primary-700);--color-primary-800:var(--solo-primary-800);--color-primary-900:var(--solo-primary-900);
  --color-neutral-50:var(--solo-neutral-50);--color-neutral-100:var(--solo-neutral-100);--color-neutral-200:var(--solo-neutral-200);--color-neutral-300:var(--solo-neutral-300);--color-neutral-400:var(--solo-neutral-400);--color-neutral-500:var(--solo-neutral-500);--color-neutral-600:var(--solo-neutral-600);--color-neutral-700:var(--solo-neutral-700);--color-neutral-800:var(--solo-neutral-800);--color-neutral-900:var(--solo-neutral-900);
  --color-background:var(--solo-background);--color-foreground:var(--solo-foreground);--color-card:var(--solo-card);--color-card-foreground:var(--solo-card-foreground);--color-muted:var(--solo-muted);--color-muted-foreground:var(--solo-muted-foreground);--color-border:var(--solo-border);--color-primary:var(--solo-primary);--color-primary-foreground:var(--solo-primary-foreground);
  --radius-sm:var(--solo-radius-sm);--radius-md:var(--solo-radius-md);--radius-lg:var(--solo-radius-lg);--radius-full:var(--solo-radius-full);--font-sans:var(--font-sans);
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline{--color-background:var(--solo-background);--color-foreground:var(--solo-foreground);--color-card:var(--solo-card);--color-card-foreground:var(--solo-card-foreground);--color-popover:var(--solo-popover);--color-popover-foreground:var(--solo-popover-foreground);--color-primary:var(--solo-primary);--color-primary-foreground:var(--solo-primary-foreground);--color-muted:var(--solo-muted);--color-muted-foreground:var(--solo-muted-foreground);--color-border:var(--solo-border);--color-input:var(--solo-input);--color-ring:var(--solo-ring);--radius-sm:var(--solo-radius-sm);--radius-md:var(--solo-radius-md);--radius-lg:var(--solo-radius-lg)}
  @layer base{body{background:var(--solo-background);color:var(--solo-foreground)}td,th{@apply break-words;word-break:break-all;word-break:auto-phrase}th{@apply whitespace-nowrap}}
    </style>
    <style id="semantic-token-fallback">
      .bg-background{background-color:var(--solo-background)}.text-background{color:var(--solo-background)}.border-background{border-color:var(--solo-background)}.ring-background{--tw-ring-color:var(--solo-background)}
      .bg-foreground{background-color:var(--solo-foreground)}.text-foreground{color:var(--solo-foreground)}.border-foreground{border-color:var(--solo-foreground)}.ring-foreground{--tw-ring-color:var(--solo-foreground)}
      .bg-card{background-color:var(--solo-card)}.text-card{color:var(--solo-card)}.border-card{border-color:var(--solo-card)}.ring-card{--tw-ring-color:var(--solo-card)}
      .bg-primary{background-color:var(--solo-primary)}.text-primary{color:var(--solo-primary)}.border-primary{border-color:var(--solo-primary)}.ring-primary{--tw-ring-color:var(--solo-primary)}
      .bg-primary-foreground{background-color:var(--solo-primary-foreground)}.text-primary-foreground{color:var(--solo-primary-foreground)}.border-primary-foreground{border-color:var(--solo-primary-foreground)}
      .bg-muted{background-color:var(--solo-muted)}.text-muted{color:var(--solo-muted)}.border-muted{border-color:var(--solo-muted)}
      .bg-muted-foreground{background-color:var(--solo-muted-foreground)}.text-muted-foreground{color:var(--solo-muted-foreground)}.border-muted-foreground{border-color:var(--solo-muted-foreground)}
      .bg-border{background-color:var(--solo-border)}.text-border{color:var(--solo-border)}.border-border{border-color:var(--solo-border)}.ring-border{--tw-ring-color:var(--solo-border)}
      .bg-primary-50{background-color:var(--solo-primary-50)}.text-primary-50{color:var(--solo-primary-50)}.border-primary-50{border-color:var(--solo-primary-50)}
      .bg-primary-100{background-color:var(--solo-primary-100)}.text-primary-100{color:var(--solo-primary-100)}.border-primary-100{border-color:var(--solo-primary-100)}
      .bg-primary-600{background-color:var(--solo-primary-600)}.text-primary-600{color:var(--solo-primary-600)}
      .bg-primary-700{background-color:var(--solo-primary-700)}.text-primary-700{color:var(--solo-primary-700)}
      .bg-primary-800{background-color:var(--solo-primary-800)}.text-primary-800{color:var(--solo-primary-800)}
      .bg-primary-900{background-color:var(--solo-primary-900)}.text-primary-900{color:var(--solo-primary-900)}
      .bg-neutral-100{background-color:var(--solo-neutral-100)}
      .text-neutral-400{color:var(--solo-neutral-400)}.text-neutral-500{color:var(--solo-neutral-500)}.text-neutral-700{color:var(--solo-neutral-700)}
    </style>
    <style>.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}[data-icon]{display:inline-flex;align-items:center;justify-content:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;background-color:currentColor}</style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="w-full max-w-md mx-auto px-4 pb-6 min-h-screen space-y-4">

        <!-- 顶部返回导航 -->
        <nav class="sticky top-0 z-50 -mx-4 px-4 bg-white/95 backdrop-blur-md border-b border-border h-12 flex items-center">
            <a href="today.html" data-dom-id="btn-back" class="inline-flex items-center justify-center w-9 h-9 -ml-2 rounded-full active:bg-muted transition-colors">
                <i data-lucide="chevron-left" class="w-5 h-5 text-foreground"></i>
            </a>
            <h1 class="flex-1 text-center text-base font-semibold text-foreground -ml-9">活动详情</h1>
        </nav>

        <!-- 头图区域 -->
        <div class="relative -mx-4 h-56 overflow-hidden" style="background: linear-gradient(160deg, #FED7AA 0%, #FB923C 45%, #EA580C 80%, #9A3412 100%);">
            <div class="absolute top-8 right-10 w-36 h-36 rounded-full opacity-30" style="background: radial-gradient(circle, #FFF7ED 0%, transparent 70%);"></div>
            <div class="absolute bottom-10 left-12 w-28 h-28 rounded-full opacity-25" style="background: radial-gradient(circle, #FFEDD5 0%, transparent 70%);"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <span class="text-7xl drop-shadow-md" aria-hidden="true" style="opacity:0.85;">☕</span>
            </div>
            <button data-dom-id="btn-favorite" class="absolute top-4 right-4 w-10 h-10 rounded-full flex items-center justify-center active:scale-95 transition-all" style="background:rgba(255,255,255,0.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);" aria-label="收藏">
                <i data-lucide="heart" class="w-5 h-5 text-white"></i>
            </button>
        </div>

        <!-- 场所信息 -->
        <section class="pt-1">
            <h2 class="text-2xl font-bold text-foreground">隐山咖啡</h2>
            <div class="flex items-center gap-2 mt-2">
                <div class="flex items-center gap-0.5">
                    <i data-lucide="star" class="w-4 h-4 fill-current" style="color:var(--state-warning);"></i>
                    <span class="text-sm font-semibold text-foreground">4.9</span>
                </div>
                <span class="text-sm text-neutral-400">·</span>
                <div class="flex items-center gap-1">
                    <i data-lucide="footprints" class="w-4 h-4" style="color:var(--solo-neutral-500);"></i>
                    <span class="text-sm text-muted-foreground">步行12分钟</span>
                </div>
            </div>
            <div class="flex flex-wrap gap-1.5 mt-3">
                <span class="inline-flex items-center px-2.5 py-1 text-xs font-medium rounded-full bg-primary-50 text-primary-700">安静</span>
                <span class="inline-flex items-center px-2.5 py-1 text-xs font-medium rounded-full bg-primary-50 text-primary-700">可办公</span>
                <span class="inline-flex items-center px-2.5 py-1 text-xs font-medium rounded-full bg-primary-50 text-primary-700">一个人不尴尬</span>
            </div>
        </section>

        <!-- AI 推荐理由 -->
        <section class="rounded-2xl p-4" style="background:var(--solo-primary-50);">
            <div class="flex items-center gap-2 mb-2">
                <div class="w-8 h-8 rounded-full flex items-center justify-center bg-primary-100">
                    <i data-lucide="sparkles" class="w-4 h-4 text-primary-600"></i>
                </div>
                <h3 class="text-sm font-semibold text-primary-800">为什么推荐给你</h3>
            </div>
            <p class="text-sm leading-relaxed text-primary-900">今天周三，你最近有点累。这里灯光柔和，适合一个人坐一会儿发发呆。手冲耶加雪菲是招牌。</p>
        </section>

        <!-- 信息卡片 -->
        <section class="rounded-2xl border border-border overflow-hidden bg-card">
            <div class="flex items-center gap-3 px-4 py-3.5 border-b border-border">
                <div class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 bg-neutral-100">
                    <i data-lucide="map-pin" class="w-[18px] h-[18px] text-primary-600"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs text-muted-foreground">地址</p>
                    <p class="text-sm font-medium mt-0.5 text-foreground">中山北路32号</p>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-neutral-400"></i>
            </div>
            <div class="flex items-center gap-3 px-4 py-3.5 border-b border-border">
                <div class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 bg-neutral-100">
                    <i data-lucide="clock" class="w-[18px] h-[18px]" style="color:var(--state-success);"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs text-muted-foreground">营业时间</p>
                    <p class="text-sm font-medium mt-0.5 text-foreground">营业中 · 今天到 22:00</p>
                </div>
            </div>
            <div class="flex items-center gap-3 px-4 py-3.5">
                <div class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 bg-neutral-100">
                    <i data-lucide="banknote" class="w-[18px] h-[18px] text-primary-600"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs text-muted-foreground">人均消费</p>
                    <p class="text-sm font-medium mt-0.5 text-foreground">人均 ¥45</p>
                </div>
            </div>
        </section>

        <!-- 底部占位 -->
        <div class="pb-24"></div>

        <!-- 底部固定操作栏 -->
        <div class="fixed bottom-0 left-0 right-0 z-50 flex items-center justify-center">
            <div class="w-full max-w-md px-4 py-3 flex items-center gap-3 border-t border-border" style="background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);">
                <button class="w-11 h-11 rounded-full flex items-center justify-center border border-border flex-shrink-0 transition-colors active:bg-muted bg-card" aria-label="导航">
                    <i data-lucide="navigation" class="w-5 h-5 text-neutral-700"></i>
                </button>
                <button data-dom-id="btn-mark-done" class="flex-1 h-11 rounded-full font-semibold text-sm text-white transition-all active:scale-[0.98]" style="background:var(--solo-primary);box-shadow:0 4px 14px rgba(249,115,22,0.35);">
                    标记完成
                </button>
            </div>
        </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
