<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的</title>
    <style id="theme-vars">
:root {
  --solo-primary-50: #FFF7ED; --solo-primary-100: #FFEDD5; --solo-primary-200: #FED7AA; --solo-primary-300: #FDBA74;
  --solo-primary-400: #FB923C; --solo-primary-500: #F97316; --solo-primary-600: #EA580C; --solo-primary-700: #C2410C;
  --solo-primary-800: #9A3412; --solo-primary-900: #7C2D12;
  --solo-neutral-50: #FAFAF9; --solo-neutral-100: #F5F5F4; --solo-neutral-200: #E7E5E4; --solo-neutral-300: #D6D3D1;
  --solo-neutral-400: #A8A29E; --solo-neutral-500: #78716C; --solo-neutral-600: #57534E; --solo-neutral-700: #44403C;
  --solo-neutral-800: #292524; --solo-neutral-900: #1C1917;
  --state-success: #22C55E; --state-warning: #F59E0B; --state-error: #EF4444; --state-info: #3B82F6;
  --solo-background: var(--solo-neutral-50); --solo-foreground: var(--solo-neutral-900); --solo-card: #FFFFFF;
  --solo-card-foreground: var(--solo-neutral-800); --solo-popover: #FFFFFF; --solo-popover-foreground: var(--solo-neutral-800);
  --solo-primary: var(--solo-primary-500); --solo-primary-foreground: #FFFFFF;
  --solo-muted: var(--solo-neutral-100); --solo-muted-foreground: var(--solo-neutral-500);
  --solo-border: var(--solo-neutral-200); --solo-input: var(--solo-neutral-200); --solo-ring: var(--solo-primary-400);
  --solo-radius-sm: 8px; --solo-radius-md: 12px; --solo-radius-lg: 16px; --solo-radius-full: 9999px;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
@theme inline {
  --color-primary-50: var(--solo-primary-50); --color-primary-100: var(--solo-primary-100); --color-primary-200: var(--solo-primary-200);
  --color-primary-300: var(--solo-primary-300); --color-primary-400: var(--solo-primary-400); --color-primary-500: var(--solo-primary-500);
  --color-primary-600: var(--solo-primary-600); --color-primary-700: var(--solo-primary-700); --color-primary-800: var(--solo-primary-800);
  --color-primary-900: var(--solo-primary-900);
  --color-neutral-50: var(--solo-neutral-50); --color-neutral-100: var(--solo-neutral-100); --color-neutral-200: var(--solo-neutral-200);
  --color-neutral-300: var(--solo-neutral-300); --color-neutral-400: var(--solo-neutral-400); --color-neutral-500: var(--solo-neutral-500);
  --color-neutral-600: var(--solo-neutral-600); --color-neutral-700: var(--solo-neutral-700); --color-neutral-800: var(--solo-neutral-800);
  --color-neutral-900: var(--solo-neutral-900);
  --color-background: var(--solo-background); --color-foreground: var(--solo-foreground); --color-card: var(--solo-card);
  --color-card-foreground: var(--solo-card-foreground); --color-muted: var(--solo-muted); --color-muted-foreground: var(--solo-muted-foreground);
  --color-border: var(--solo-border); --color-primary: var(--solo-primary); --color-primary-foreground: var(--solo-primary-foreground);
  --radius-sm: var(--solo-radius-sm); --radius-md: var(--solo-radius-md); --radius-lg: var(--solo-radius-lg); --radius-full: var(--solo-radius-full);
  --font-sans: var(--font-sans);
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--solo-background); --color-foreground: var(--solo-foreground); --color-card: var(--solo-card);
    --color-card-foreground: var(--solo-card-foreground); --color-popover: var(--solo-popover); --color-popover-foreground: var(--solo-popover-foreground);
    --color-primary: var(--solo-primary); --color-primary-foreground: var(--solo-primary-foreground); --color-muted: var(--solo-muted);
    --color-muted-foreground: var(--solo-muted-foreground); --color-border: var(--solo-border); --color-input: var(--solo-input); --color-ring: var(--solo-ring);
    --radius-sm: var(--solo-radius-sm); --radius-md: var(--solo-radius-md); --radius-lg: var(--solo-radius-lg);
  }
  @layer base {
    body { background: var(--solo-background); color: var(--solo-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background{background-color:var(--solo-background)}.text-background{color:var(--solo-background)}.border-background{border-color:var(--solo-background)}.ring-background{--tw-ring-color:var(--solo-background)}
      .bg-foreground{background-color:var(--solo-foreground)}.text-foreground{color:var(--solo-foreground)}.border-foreground{border-color:var(--solo-foreground)}.ring-foreground{--tw-ring-color:var(--solo-foreground)}
      .bg-card{background-color:var(--solo-card)}.text-card{color:var(--solo-card)}.border-card{border-color:var(--solo-card)}.ring-card{--tw-ring-color:var(--solo-card)}
      .bg-card-foreground{background-color:var(--solo-card-foreground)}.text-card-foreground{color:var(--solo-card-foreground)}.border-card-foreground{border-color:var(--solo-card-foreground)}.ring-card-foreground{--tw-ring-color:var(--solo-card-foreground)}
      .bg-primary{background-color:var(--solo-primary)}.text-primary{color:var(--solo-primary)}.border-primary{border-color:var(--solo-primary)}.ring-primary{--tw-ring-color:var(--solo-primary)}
      .bg-primary-foreground{background-color:var(--solo-primary-foreground)}.text-primary-foreground{color:var(--solo-primary-foreground)}.border-primary-foreground{border-color:var(--solo-primary-foreground)}.ring-primary-foreground{--tw-ring-color:var(--solo-primary-foreground)}
      .bg-muted{background-color:var(--solo-muted)}.text-muted{color:var(--solo-muted)}.border-muted{border-color:var(--solo-muted)}.ring-muted{--tw-ring-color:var(--solo-muted)}
      .bg-muted-foreground{background-color:var(--solo-muted-foreground)}.text-muted-foreground{color:var(--solo-muted-foreground)}.border-muted-foreground{border-color:var(--solo-muted-foreground)}.ring-muted-foreground{--tw-ring-color:var(--solo-muted-foreground)}
      .bg-border{background-color:var(--solo-border)}.text-border{color:var(--solo-border)}.border-border{border-color:var(--solo-border)}.ring-border{--tw-ring-color:var(--solo-border)}
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
      [data-icon]{display:inline-flex;align-items:center;justify-content:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;background-color:currentColor}
    </style>
</head>
<body class="font-sans antialiased min-h-screen" style="font-family: var(--font-sans);">
  <div class="max-w-md mx-auto px-4 pb-20">

    <!-- 顶部：编辑按钮 -->
    <div class="pt-12 flex justify-end">
      <button data-dom-id="btn-edit-profile" class="w-9 h-9 rounded-full flex items-center justify-center transition active:scale-95" style="background: var(--solo-neutral-100);">
        <i data-lucide="pencil" class="w-4 h-4" style="color: var(--solo-neutral-600);"></i>
      </button>
    </div>

    <!-- 个人资料区 -->
    <div class="flex flex-col items-center pt-2 pb-6">
      <!-- 头像 -->
      <div class="w-16 h-16 rounded-full flex items-center justify-center" style="background: linear-gradient(135deg, var(--solo-primary-400), var(--solo-primary-600)); box-shadow: 0 6px 20px rgba(249,115,22,0.25);">
        <i data-lucide="user" class="w-8 h-8 text-white"></i>
      </div>
      <!-- 昵称 -->
      <h1 class="mt-3 text-xl font-bold text-foreground">一个人</h1>
      <!-- 简介 -->
      <p class="mt-1 text-sm" style="color: var(--solo-neutral-500);">今天也要好好生活</p>
      <!-- 统计数据 -->
      <div class="mt-4 inline-flex items-center gap-0 rounded-full px-1" style="background: var(--solo-neutral-100);">
        <div class="flex flex-col items-center px-4 py-2">
          <span class="text-base font-semibold text-foreground">128</span>
          <span class="text-[11px] mt-0.5" style="color: var(--solo-neutral-500);">记录天数</span>
        </div>
        <div class="w-px h-7" style="background: var(--solo-neutral-200);"></div>
        <div class="flex flex-col items-center px-4 py-2">
          <span class="text-base font-semibold text-foreground">23</span>
          <span class="text-[11px] mt-0.5" style="color: var(--solo-neutral-500);">收藏</span>
        </div>
        <div class="w-px h-7" style="background: var(--solo-neutral-200);"></div>
        <div class="flex flex-col items-center px-4 py-2">
          <span class="text-base font-semibold text-foreground">12</span>
          <span class="text-[11px] mt-0.5" style="color: var(--solo-neutral-500);">回忆</span>
        </div>
      </div>
    </div>

    <!-- 菜单列表 -->
    <div class="space-y-3">

      <!-- 我的回忆 -->
      <div data-dom-id="btn-life-story" class="bg-card border border-border rounded-xl p-4 flex items-center gap-3 cursor-pointer active:scale-[0.99] transition">
        <div class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0" style="background: var(--solo-primary-50);">
          <i data-lucide="history" class="w-5 h-5" style="color: var(--solo-primary-500);"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-foreground">我的回忆</p>
          <p class="text-xs mt-0.5" style="color: var(--solo-neutral-500);">你的生活值得被记住</p>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: var(--solo-neutral-400);"></i>
      </div>

      <!-- 我的收藏 -->
      <div data-dom-id="btn-favorites" class="bg-card border border-border rounded-xl p-4 flex items-center gap-3 cursor-pointer active:scale-[0.99] transition">
        <div class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0" style="background: #FFF1F2;">
          <i data-lucide="heart" class="w-5 h-5" style="color: #EC4899;"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-foreground">我的收藏</p>
          <p class="text-xs mt-0.5" style="color: var(--solo-neutral-500);">23个想去的地方</p>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: var(--solo-neutral-400);"></i>
      </div>

      <!-- 消息通知 -->
      <div data-dom-id="btn-notifications" class="bg-card border border-border rounded-xl p-4 flex items-center gap-3 cursor-pointer active:scale-[0.99] transition">
        <div class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0 relative" style="background: #EFF6FF;">
          <i data-lucide="bell" class="w-5 h-5" style="color: var(--state-info);"></i>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full" style="background: var(--state-error);"></span>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-foreground">消息通知</p>
          <p class="text-xs mt-0.5" style="color: var(--solo-neutral-500);">2条未读</p>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: var(--solo-neutral-400);"></i>
      </div>

      <!-- Solo Pro 会员 -->
      <div data-dom-id="btn-membership" class="rounded-xl p-4 flex items-center gap-3 cursor-pointer active:scale-[0.99] transition relative overflow-hidden" style="background: linear-gradient(135deg, #FFF7ED 0%, #FFEDD5 100%); border: 1px solid var(--solo-primary-200);">
        <!-- 装饰 -->
        <div class="absolute -top-4 -right-4 w-16 h-16 rounded-full opacity-30" style="background: var(--solo-primary-300);"></div>
        <div class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0 relative z-10" style="background: linear-gradient(135deg, var(--solo-primary-400), var(--solo-primary-600)); box-shadow: 0 4px 10px rgba(249,115,22,0.3);">
          <i data-lucide="crown" class="w-5 h-5 text-white"></i>
        </div>
        <div class="flex-1 min-w-0 relative z-10">
          <div class="flex items-center gap-1.5">
            <p class="text-sm font-semibold" style="color: var(--solo-primary-800);">Solo Pro 会员</p>
            <span class="text-[10px] px-1.5 py-0.5 rounded-sm font-medium text-white" style="background: linear-gradient(90deg, var(--solo-primary-500), var(--solo-primary-700));">PRO</span>
          </div>
          <p class="text-xs mt-0.5" style="color: var(--solo-primary-700);">解锁AI高级规划</p>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 shrink-0 relative z-10" style="color: var(--solo-primary-600);"></i>
      </div>

      <!-- 设置 -->
      <div data-dom-id="btn-settings" class="bg-card border border-border rounded-xl p-4 flex items-center gap-3 cursor-pointer active:scale-[0.99] transition">
        <div class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0" style="background: var(--solo-neutral-100);">
          <i data-lucide="settings" class="w-5 h-5" style="color: var(--solo-neutral-600);"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-foreground">设置</p>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: var(--solo-neutral-400);"></i>
      </div>
    </div>

    <!-- 版本号 -->
    <div class="mt-10 pb-4 flex justify-center">
      <span class="text-xs" style="color: var(--solo-neutral-500);">Solo v1.0</span>
    </div>

  </div>

  <!-- 底部导航 -->
  <nav data-mobile-nav="global" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-border h-[56px] z-50">
    <div class="w-full max-w-md mx-auto grid grid-cols-6 h-full">
      <a href="today.html" data-nav-key="today" data-dom-id="nav-today" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground">
        <i data-lucide="home" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">今日</span>
      </a>
      <a href="explore.html" data-nav-key="explore" data-dom-id="nav-explore" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground">
        <i data-lucide="compass" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">探索</span>
      </a>
      <a href="mood.html" data-nav-key="mood" data-dom-id="nav-mood" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground">
        <i data-lucide="smile" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">情绪</span>
      </a>
      <a href="growth.html" data-nav-key="growth" data-dom-id="nav-growth" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground">
        <i data-lucide="trending-up" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">成长</span>
      </a>
      <a href="community.html" data-nav-key="community" data-dom-id="nav-community" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground">
        <i data-lucide="users" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">同行</span>
      </a>
      <a href="me.html" data-nav-key="me" data-dom-id="nav-me" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-primary" data-active="true">
        <i data-lucide="user" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate font-medium">我的</span>
      </a>
    </div>
  </nav>

  <script>lucide.createIcons();</script>
</body>
</html>
